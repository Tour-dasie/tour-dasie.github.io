<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4efe7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tour d'Asie">
<title>Tour d'Asie — Carnet de voyage</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4efe7; --bg2:#ece5d9; --card:#fffdf9; --card2:#f7f1e7;
  --ink:#332f29; --ink2:#5f584e; --muted:#9a9084; --faint:#c3b8a8;
  --line:#e8dfd0; --line2:#ddd2be;
  --acc:#c67c5b; --acc-d:#a35e3e; --acc-soft:#f0dccf;
  --sage:#8ba888; --sage-d:#5f7d5c;
  --blue:#7ea6c0; --blue-d:#4d7893;
  --gold:#cdaa5f; --gold-d:#96742f;
  --plum:#a98cae; --rose:#c98a83;
  --green:#6fae7c; --red:#cf7a6a;
  --r:18px; --sh:0 4px 18px rgba(120,100,70,.10); --sh2:0 8px 30px rgba(120,100,70,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.5; padding-bottom:80px; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:640px;margin:0 auto;padding:0 15px}
h1,h2,h3{margin:0;font-weight:750;letter-spacing:-.01em}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--blue-d)}
img{max-width:100%}

header{position:sticky;top:0;z-index:20;background:rgba(244,239,231,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 11px) 0 10px}
.hrow{display:flex;align-items:center;justify-content:space-between}
.htitle{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px;color:var(--ink)}
.htitle .globe{font-size:19px}
.hbtns{display:flex;gap:7px}
.iconbtn{width:37px;height:37px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:var(--sh)}
.iconbtn:active{background:var(--card2)}

.view{padding:16px 0 8px;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card.tight{padding:13px 15px}
.sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:750;margin:4px 4px 10px}

/* HERO photo */
.phero{position:relative;border-radius:22px;overflow:hidden;margin-bottom:14px;box-shadow:var(--sh2);
  min-height:186px;display:flex;flex-direction:column;justify-content:flex-end;
  background-image:linear-gradient(180deg,rgba(40,32,24,.05),rgba(40,32,24,.62)),
    url('https://images.unsplash.com/photo-1573824398985-ca6aee6b0cbd?w=1000&q=70&auto=format&fit=crop'),
    linear-gradient(135deg,#d8a98f,#b06f4e);
  background-size:cover;background-position:center}
.phero .pc{position:relative;padding:20px;color:#fff}
.phero .badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  background:rgba(255,255,255,.22);color:#fff;padding:4px 11px;border-radius:20px;margin-bottom:10px;backdrop-filter:blur(4px)}
.phero .big{font-size:38px;font-weight:800;line-height:1.02;letter-spacing:-.02em;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.phero .big small{font-size:15px;font-weight:600;opacity:.92}
.phero .sub{margin-top:8px;font-size:13.5px;opacity:.95;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.phero .cur{font-size:21px;font-weight:800;display:flex;align-items:center;gap:9px;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.pbar{height:9px;border-radius:6px;background:rgba(255,255,255,.28);overflow:hidden;margin-top:14px}
.pbar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#fff,#ffe4c4)}
.pmeta{display:flex;justify-content:space-between;font-size:12px;opacity:.95;margin-top:7px}

/* light hero (non-photo) */
.lhero{background:linear-gradient(135deg,var(--acc-soft),#f6ede2);border:1px solid var(--line);border-radius:22px;
  padding:20px;margin-bottom:14px;box-shadow:var(--sh)}
.lhero .badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  background:#fff;color:var(--acc-d);padding:4px 11px;border-radius:20px;margin-bottom:10px}
.lhero .big{font-size:34px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.lhero .big small{font-size:15px;font-weight:600;color:var(--ink2)}
.lhero .pbar{background:#fff}.lhero .pbar>i{background:linear-gradient(90deg,var(--acc),var(--gold))}
.lhero .pmeta{color:var(--ink2);opacity:1}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px 10px;text-align:center;box-shadow:var(--sh)}
.stat .n{font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--acc-d)}
.stat .l{font-size:10.5px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}

/* photo strip */
.strip{display:flex;gap:10px;overflow-x:auto;padding:2px 0 6px;margin:0 -15px;padding-left:15px;padding-right:15px;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.pcard{flex:0 0 auto;width:150px;height:104px;border-radius:14px;overflow:hidden;position:relative;box-shadow:var(--sh);border:1px solid var(--line)}
.pcard .im{width:100%;height:100%;object-fit:cover;background:var(--card2)}
.pcard .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 9px 7px;font-size:11px;font-weight:600;color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.72));text-shadow:0 1px 4px rgba(0,0,0,.5)}

.mini{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.mini:first-child{border-top:none}
.mini .dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--acc)}
.mini .txt{flex:1}.mini .t{font-weight:650}.mini .d{font-size:12.5px;color:var(--ink2);margin-top:1px}

/* ITINERARY */
.stage{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:13px;overflow:hidden;box-shadow:var(--sh)}
.banner{position:relative;height:120px;background-size:cover;background-position:center;cursor:pointer;display:flex;align-items:flex-end}
.banner .bov{position:relative;width:100%;padding:12px 15px;display:flex;align-items:center;gap:11px;color:#fff}
.banner .fl{font-size:27px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))}
.banner .bi{flex:1;min-width:0}
.banner .nm{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.banner .meta{font-size:12.5px;margin-top:2px;text-shadow:0 1px 5px rgba(0,0,0,.6);opacity:.96}
.banner .chev{font-size:13px;text-shadow:0 1px 4px rgba(0,0,0,.6);transition:transform .25s}
.stage.open .banner .chev{transform:rotate(90deg)}
.banner .photobtn{position:absolute;top:9px;right:10px;width:32px;height:32px;border-radius:10px;background:rgba(0,0,0,.34);
  backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.ringw{position:absolute;top:9px;left:10px}
.tag{font-size:10px;font-weight:750;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em}
.tag.val{background:rgba(255,255,255,.9);color:var(--sage-d)}
.tag.add{background:rgba(255,255,255,.9);color:var(--plum)}
.tag.now{background:#fff;color:var(--acc-d)}
.ring{width:40px;height:40px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.stage-body{display:none;padding:2px 15px 10px}
.stage.open .stage-body{display:block}
.sb-line{display:flex;gap:9px;font-size:13px;color:var(--ink2);padding:9px 0;border-top:1px solid var(--line);align-items:flex-start}
.sb-line .k{flex:0 0 74px;color:var(--muted);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.03em;padding-top:1px}
.film{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin:11px 0;font-size:12.8px;color:var(--ink2)}
.film b{color:var(--gold-d)}
.spots{display:flex;flex-wrap:wrap;gap:6px;padding:11px 2px 5px;border-top:1px solid var(--line);margin-top:2px}
.spots-l{flex-basis:100%;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:750;margin-bottom:3px}
.spot{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--blue-d);
  background:var(--card2);border:1px solid var(--line2);border-radius:20px;padding:6px 11px;text-decoration:none;line-height:1.2}
.spot::before{content:"📍";font-size:11px}
.spot:active{background:var(--acc-soft);border-color:var(--acc)}
.dtx .spots{margin-top:9px}
.day.done .dtx .spots,.day.done .dtx .spots *{text-decoration:none}
.wish{cursor:pointer;font-size:16px;line-height:1;color:var(--faint);padding:1px 4px 1px 0;flex:0 0 auto}
.wish.on{color:#e8b64a}
.resto .spot{color:var(--sage-d)}
.resto .spot-p{color:var(--sage-d);background:#e7f0e0;border-color:var(--sage)}
.resto-toggle{cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-bottom:0}
.resto .rcount{background:#e7f0e0;color:var(--sage-d);border:1px solid var(--sage);border-radius:20px;padding:0 7px;font-size:10px;line-height:16px;font-weight:800}
.resto .rchev{transition:transform .2s;font-size:11px;color:var(--muted)}
.resto.folded .resto-list{display:none}
.resto:not(.folded) .rchev{transform:rotate(180deg)}
.resto .resto-list{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.social.folded .resto-list{display:none}
.social:not(.folded) .rchev{transform:rotate(180deg)}
.social .spots-l{color:var(--plum)}
.so-item{flex-basis:100%;font-size:12.8px;color:var(--ink2);line-height:1.46;margin:2px 0}
.so-cap{flex-basis:100%;font-size:12.8px;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 11px;margin:4px 0;line-height:1.46}
.so-tag{flex-basis:100%;font-size:12px;color:var(--blue-d);font-weight:600;margin-top:4px;word-break:break-word}
.prat{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:14px;margin:11px 0 3px;overflow:hidden;box-shadow:var(--sh)}
.prat-h{cursor:pointer;padding:11px 14px;font-weight:800;font-size:13.5px;color:var(--ink);display:flex;align-items:center;gap:7px}
.prat-off{color:var(--muted);font-weight:600;font-size:11.5px}
.prat-h .rchev{margin-left:auto;transition:transform .2s;font-size:11px;color:var(--muted)}
.prat:not(.folded) .prat-h .rchev{transform:rotate(180deg)}
.prat.folded .prat-body{display:none}
.prat-body{padding:0 14px 12px}
.prat-row{padding:9px 0;border-top:1px solid var(--line);font-size:12.8px;color:var(--ink2);line-height:1.5}
.prat-row>b{color:var(--ink);font-size:12px;text-transform:uppercase;letter-spacing:.02em;display:block;margin-bottom:3px}
.phr{padding:3px 0;font-size:12.6px;color:var(--ink2)}
.phr-loc{font-weight:700;color:var(--ink)}
.phr-ph{color:var(--muted);font-style:italic;font-size:11.5px}

.block{margin:9px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.block-h{display:flex;align-items:center;gap:11px;padding:11px 12px}
.block-h .bt{flex:1}.block-h .bt .c{font-weight:750}.block-h .bt .dd{font-size:12px;color:var(--muted);margin-top:1px}
.block-h .exp{color:var(--faint);font-size:12px;padding:4px}
.block-h .mapl{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;text-decoration:none;margin-right:2px}
.block-h .mapl:active{background:var(--acc-soft)}
.days{display:none;padding:0 12px 8px}
.block.open .days{display:block}
.day{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start}
.day .num{flex:0 0 auto;font-size:11px;font-weight:800;color:var(--acc-d);background:var(--acc-soft);border-radius:8px;padding:3px 7px;min-width:34px;text-align:center}
.day .dtx{flex:1;font-size:13.3px}.day .dtx .dc{font-weight:700}
.day.done .dtx,.block-h.done .bt{opacity:.45;text-decoration:line-through;text-decoration-color:var(--faint)}

.cb{width:23px;height:23px;border-radius:8px;border:2px solid var(--line2);background:var(--card);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:.15s}
.cb.on{background:var(--sage);border-color:var(--sage)}
.cb.on::after{content:"✓";color:#fff;font-weight:800;font-size:13px}
.cb.big{width:26px;height:26px}

/* BUDGET */
.bud-hero{background:linear-gradient(135deg,#dce7d6,#eef2e6)}
.bud-hero .badge{color:var(--sage-d)}.bud-hero .big{color:var(--ink)}
.bud-hero .pbar>i{background:linear-gradient(90deg,var(--sage),var(--blue))}
.bud-tot{font-size:33px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.bud-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.bud-row .lab{color:var(--ink2);font-size:13px}
.cat-line{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.cat-line:first-child{border-top:none}
.cat-line .fl{font-size:19px;width:24px;text-align:center}
.cat-line .nm{flex:1;font-weight:650}
.cat-line .amt{text-align:right;font-variant-numeric:tabular-nums}
.cat-line .amt .r{font-weight:750}.cat-line .amt .p{font-size:11.5px;color:var(--muted)}
.tinybar{height:6px;border-radius:4px;background:var(--card2);overflow:hidden;margin-top:6px;border:1px solid var(--line)}
.tinybar>i{display:block;height:100%;border-radius:4px}
.exp-item{display:flex;gap:11px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.exp-item .em{font-size:18px;width:22px;text-align:center}
.exp-item .ei{flex:1;min-width:0}.exp-item .ei .t{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp-item .ei .s{font-size:11.5px;color:var(--muted)}
.exp-item .ea{font-weight:750;font-variant-numeric:tabular-nums}
.exp-item .del{color:var(--faint);padding:6px;font-size:14px}

/* REMINDERS */
.seg{display:flex;background:var(--bg2);border-radius:13px;padding:4px;margin-bottom:16px;border:1px solid var(--line)}
.seg button{flex:1;padding:9px;border-radius:10px;font-size:13px;font-weight:700;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--acc-d);box-shadow:var(--sh)}
.rem{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;margin-bottom:9px;box-shadow:var(--sh);position:relative;overflow:hidden}
.rem .barcol{position:absolute;left:0;top:0;bottom:0;width:4px}
.rem .icn{font-size:20px;width:26px;text-align:center;flex:0 0 auto}
.rem .ri{flex:1;min-width:0}
.rem .ri .t{font-weight:700;font-size:14px}
.rem .ri .s{font-size:12px;color:var(--muted);margin-top:2px}
.rem .ri .when{font-size:11.5px;font-weight:700;margin-top:5px;display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px}
.rem.done .ri .t,.rem.done .ri .s{opacity:.45;text-decoration:line-through;text-decoration-color:var(--faint)}
.w-soon{background:#fdeee6;color:var(--acc-d)}.w-now{background:#fbe4dc;color:#b34e34}.w-late{background:#f7dcd6;color:#b0402c}
.w-far{background:var(--card2);color:var(--muted)}.w-done{background:#e3f0e0;color:var(--sage-d)}
.bell{font-size:11px;color:var(--gold-d);margin-top:5px;display:flex;align-items:center;gap:4px}
.flight{display:flex;gap:12px;align-items:center;padding:13px 14px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;margin-bottom:9px;box-shadow:var(--sh)}
.flight .fr{flex:1}
.flight .fr .rt{font-weight:750;font-size:14.5px;display:flex;align-items:center;gap:7px}
.flight .fr .dt{font-size:12px;color:var(--muted);margin-top:2px}
.flight .fr .ci{font-size:11.5px;font-weight:700;margin-top:5px;display:inline-block;padding:2px 8px;border-radius:20px}
.flight .del{color:var(--faint);padding:6px;font-size:14px}

/* CHECKLIST */
.ck-when{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--gold-d);
  margin:16px 4px 9px;display:flex;align-items:center;gap:7px}
.ck-item{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;background:var(--card);
  border:1px solid var(--line);border-radius:13px;margin-bottom:8px;box-shadow:var(--sh)}
.ck-item .ci{flex:1}.ck-item .ci .t{font-weight:650;font-size:14px}.ck-item .ci .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.ck-item.done .ci{opacity:.45;text-decoration:line-through;text-decoration-color:var(--faint)}

/* MAP */
#map{height:calc(100vh - 250px);min-height:360px;border-radius:var(--r);border:1px solid var(--line);overflow:hidden;box-shadow:var(--sh);touch-action:none}
.leaflet-container{touch-action:none!important}
.leaflet-container{background:#e8e0d2;font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:7px 13px;margin:12px 3px 0;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.pop b{font-size:14px}.pop .pm{color:#777;font-size:12px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,253,249,.95);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;padding:6px 2px calc(env(safe-area-inset-bottom) + 6px)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 1px;color:var(--muted);font-size:10px;font-weight:650}
.nav button .ic{font-size:19px;line-height:1;filter:grayscale(.3) opacity(.75)}
.nav button.on{color:var(--acc-d)}
.nav button.on .ic{filter:none}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(50,40,28,.42);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border-top-left-radius:24px;border-top-right-radius:24px;width:100%;max-width:640px;
  padding:18px 18px calc(env(safe-area-inset-bottom) + 20px);max-height:90vh;overflow:auto;animation:up .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 40px rgba(0,0,0,.2)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet h3{font-size:18px;margin-bottom:6px;color:var(--ink)}
.grabber{width:42px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 15px}

  {c:"Lijiang & Tiger Leaping Gorge",dd:"25–28 oct · 4j",co:[26.8721,100.2299],resto:[{n:"阿婆情腊排骨 (Ā pó qíng là páigǔ)",p:"€ fondue/hotpot local (腊排骨火锅)",t:"L'adresse la plus citée par les habitants et blogs 2025 pour le plat signature de Lijiang : côtes de porc séchées et fumées mijotées 4-5h dans un bouillon aux champignons sauvages du Yunnan, avec sa sauce maison à l'échalote frite et à la coriandre."},{n:"Native Black Goat Street (本地黑山羊一条街), Jinkai Square",p:"€€ hotpot de chèvre noire",t:"Rue entière dédiée au hotpot de chèvre noire de Lijiang, mijoté au dangshen et aux herbes pendant des heures ; commander le pot de chèvre pour 2-3 personnes avec tofu et radis, servi avec la sauce piment locale."},{n:"Sifang Street (四方街) - stands de mixian",p:"฿ street food / marché de nouilles",t:"La rue de nouilles la plus authentique de la vieille ville : demandez le mixian aux champignons (米线) dans un des petits stands familiaux, plat quotidien des Naxi bien plus fiable que les restos de la rue principale touristique."},{n:"Stands de Lijiang Baba (丽江粑粑) à Shuhe Old Town",p:"฿ street food / snack",t:"Galette naxi traditionnelle à la farine de blé, sucrée (à la rose) ou salée, à manger en se baladant le long des canaux de Shuhe, loin de la foule de la vieille ville principale."}],spots:[{n:"Vieille ville de Lijiang",p:"50 RMB (~6,50 €), tarif de préservation valable 365 jours, entrées illimitées",t:"Depuis le 1er août 2025 le tarif a baissé de 80 à 50 RMB et se paie aux points de contrôle à l'entrée de la vieille ville (gratuit pour les plus de 60 ans et les enfants de moins de 1,2 m) ; gardez bien le reçu, il sert aussi de billet pour l'étang du Dragon Noir et le village de Baisha. Venez tôt le matin ou en soirée pour éviter la foule, la ville est prise d'assaut en milieu de journée."},{n:"Étang du Dragon Noir",p:"Inclus dans le billet de la vieille ville (50 RMB, ~6,50 €), pas de billet séparé",t:"Présentez le reçu du 'maintenance fee' de la vieille ville de Lijiang à l'entrée du parc Jade Spring ; venez tôt le matin par temps clair pour avoir la meilleure chance de voir le reflet du Jade Dragon Snow Mountain dans l'eau, car les nuages couvrent souvent le sommet l'après-midi."},{n:"Village de Baisha",p:"Village gratuit ; fresques de Baisha (Dabaoji Palace) 30 RMB (~4 €)",t:"Gardez votre reçu de billet de la vieille ville de Lijiang, il peut être demandé pour accéder aux fresques ; comptez 2 à 3 heures sur place et privilégiez la matinée, c'est bien plus calme et authentique que la vieille ville, mais les explications sur les fresques sont limitées donc renseignez-vous avant ou prenez un guide local."},{n:"Tiger Leaping Gorge",p:"~45-65 RMB (~6-8,50 €) l'entrée du parc selon la source, à confirmer sur place",t:"Le droit d'entrée est souvent collecté directement dans le bus par un agent du parc ; privilégiez la randonnée de septembre-octobre (temps clair, moins de risques d'éboulements) et évitez juin-août, saison des pluies dangereuse, comptez 2 jours pour les 20 km du sentier haut."},{n:"Qiaotou",p:"Gratuit (simple point de départ, le tarif payé ici correspond au billet d'entrée du parc Tiger Leaping Gorge)",t:"Prenez le bus du matin (8h, 9h ou 9h30) depuis la gare routière de Lijiang, environ 35-50 RMB pour 2h de trajet, plutôt que les minivans privés qui réclament 400-500 RMB à la gare ; vérifiez que votre billet de bus va bien jusqu'à Qiaotou et non plus loin, sinon vous ratez le départ du sentier haut."},{n:"Tina's Guesthouse",p:"~50-300 RMB la nuit selon chambre (~7-40 €) : dortoir moins cher, chambre privée avec vue plus chère",t:"Réservez une chambre au 3e étage pour la meilleure vue sur les gorges et profitez du bus organisé par Tina pour revenir vers Qiaotou ou continuer vers Shangri-La (départ vers 15h30, ne le ratez pas) ; consigne bagages gratuite disponible."}],days:[
   {n:12,dt:"25 oct",sp:["Vieille ville de Lijiang","Étang du Dragon Noir","Village de Baisha"],t:"Lijiang : vieille ville & Étang du Dragon Noir · village de Baisha."},
   {n:13,dt:"26 oct",sp:["Qiaotou","Tiger Leaping Gorge"],t:"Transfert Lijiang→Qiaotou · départ trek TLG jusqu'au Naxi Family Guesthouse."},
   {n:14,dt:"27 oct",sp:["Tina's Guesthouse"],t:"Trek TLG jour 2 : les 28 lacets · nuit à Tina's Guesthouse."},
   {n:15,dt:"28 oct",t:"Fin du trek, descente à la rivière · transfert vers Shangri-La (~2-3h)."}]},
  {c:"Shangri-La & Kunming",dd:"29 oct–1 nov · 4j",co:[27.8259,99.7068],resto:[{n:"Laozihaomaoniu Hot Pot (老字号牦牛火锅)",p:"¥¥ restaurant tibétain, vieille ville de Dukezong, Shangri-La",t:"Adresse historique cachée dans la vieille ville, prisée des locaux : commander le fondue au yak (bœuf tibétain fondant), les galettes d'orge et le thé au beurre traditionnel."},{n:"Yun Aman - nouilles de riz au bœuf épicé (云安曼牛肉米线)",p:"฿ street food / gargote, Shangri-La",t:"Bol de mixian (nouilles de riz) au bœuf épicé garni de coriandre et menthe fraîche, à accompagner des pommes de terre sautées à la menthe — repas simple et savoureux plébiscité sur les blogs récents."},{n:"Fuhuayuan (福华园过桥米线)",p:"€ / ¥¥ restaurant institution locale, Kunming",t:"Institution qui sert le guoqiao mixian (nouilles 'passant le pont') depuis 1938 : commander le bouillon de poulet fumant avec ses garnitures crues à cuire soi-même dans le bol, portions généreuses et prix doux."},{n:"Marché de nuit Wanhong / Nanqiang (万虹夜市 / 南强夜市)",p:"฿ street food / marché nocturne, Kunming",t:"Le meilleur endroit pour grignoter en marchant le soir : pommes de terre à la mode Dai, rouleaux de riz au porc rôti et bœuf sauce aigre façon Wenshan, ambiance locale garantie loin des attrape-touristes."}],spots:[{n:"Monastère de Songzanlin",p:"~75 CNY (55 CNY entrée + 20 CNY navette obligatoire) (~9,70 €)",t:"Venir tôt le matin pour éviter les groupes et profiter de la lumière ; prévoir 2 à 3h de visite et des vêtements chauds car le site est à plus de 3300 m d'altitude."},{n:"Vieille ville de Dukezong",p:"Gratuit",t:"Se balader dès l'aube en partant de la porte nord vers la place Moonlight, puis grimper au parc Guishan pour voir le grand moulin à prières avec une vue dégagée et sans la foule."},{n:"Parc national de Pudacuo",p:"~138 CNY (68 CNY entrée + 70 CNY navette obligatoire) (~18 €)",t:"Compter 4 à 6h sur place, suivre le circuit dans le sens horaire (lac Shudu, pâturage de Militang, lac Bita) ; la voiture privée n'est pas autorisée dans le parc, seul le bus officiel y accède."},{n:"Lac Napa",p:"~30 CNY (~4 €), certaines zones/saisons jusqu'à 40 CNY",t:"Pas besoin de réserver, les billets s'achètent sur place ; privilégier la fin d'après-midi pour la lumière dorée sur la prairie et les yaks, ou faire le tour du lac à vélo/voiture (route en grande partie libre d'accès)."},{n:"Parc Cuihu Kunming",p:"Gratuit",t:"Venir tôt le matin en semaine pour éviter la foule et voir les habitants pratiquer le tai-chi ; en hiver (nov-mars), passer avant 10h pour nourrir les mouettes de Sibérie qui affluent dans le parc."}],days:[
   {n:16,dt:"29 oct",sp:["Monastère de Songzanlin","Vieille ville de Dukezong"],t:"Monastère de Songzanlin · vieille ville Dukezong (après-midi)."},
   {n:17,dt:"30 oct",sp:["Lac Napa","Parc national de Pudacuo"],t:"Lac Napa / parc national de Pudacuo, journée complète."},
   {n:18,dt:"31 oct",t:"Train Shangri-La→Kunming ~5-6h, arrivée après-midi."},
   {n:19,dt:"1 nov",sp:["Parc Cuihu Kunming"],t:"Kunming : parc Cuihu · train de nuit Kunming→Guilin en soirée."}]},
  {c:"Guilin & Yangshuo",dd:"2–9 nov · 8j",co:[24.7783,110.4964],resto:[{n:"Chongshan Mifen (崇善米粉)",p:"฿ street food / gargote locale",t:"Institution de Guilin depuis 1956 (bouillon secret aux épices) : commandez les nouilles de riz nature avec le riz soufflé croustillant et un œuf mariné ('原汤米粉+锅烧+卤蛋'), on y fait la queue dès 6h avec les habitants."},{n:"Marché nocturne de Xicheng Lu (西城路夜市), Guilin",p:"฿ marché de rue",t:"Le meilleur endroit pour goûter brochettes grillées, nouilles de riz et escargots sautés à la mode locale pour quelques euros, loin des restaurants à touristes du centre."},{n:"Huo Xiaoniu Beer Fish (火小牛啤酒鱼)",p:"€€ restaurant local",t:"Pour le fameux poisson à la bière (啤酒鱼) sans tomber dans les attrape-touristes de West Street : poisson de la rivière Li mijoté à la bière et aux épices, tendre et parfumé, très recommandé par les guides récents 2025-2026."},{n:"Tonglai Rice Noodles, ruelle Tongquan (通泉巷), Yangshuo",p:"฿ street food",t:"Petite gargote de quartier réputée pour ses nouilles de riz au bœuf braisé, l'endroit idéal pour un petit-déjeuner authentique loin de l'agitation de West Street."}],spots:[{n:"Reed Flute Cave",p:"90 CNY adulte (~11,50 €), 45 CNY enfant, gratuit -1,20m",t:"Arrivez à l'ouverture (9h) ou après 16h30 pour éviter les groupes entre 10h et 14h ; refusez les extras payants (petit train, photo, etc.) inutiles, la visite dure environ 1h et il fait frais (18°C), prévoyez une veste."},{n:"Colline de la Trompe d'Éléphant",p:"Gratuit (réservation en ligne conseillée 1 à 7 jours avant)",t:"L'entrée est désormais gratuite sur simple scan d'ID/réservation en ligne ; venez tôt le matin (7h-9h) pour la lumière douce et moins de monde, ou en fin d'après-midi (17h-18h30) pour le coucher de soleil."},{n:"Croisière rivière Li (Guilin → Yangshuo)",p:"~215 CNY/adulte (~27,50 €) en bateau 3 étoiles, 108 CNY enfant ; déjeuner en sus 30-50 CNY",t:"Les bateaux partent le matin entre 9h30 et 10h pour une croisière de 4-5h (83 km) ; réservez plutôt via votre hôtel à Guilin, et privilégiez avril-début novembre car en été (juin-août) le niveau d'eau peut faire suspendre les départs."},{n:"West Street Yangshuo",p:"Gratuit (accès libre à la rue, on paie seulement ce qu'on consomme/achète)",t:"Venez le matin ou en début d'après-midi pour une ambiance calme, les boutiques s'animent après 10h et la rue devient très bondée et bruyante le soir ; évitez la Golden Week début octobre."},{n:"Moon Hill",p:"~20 CNY (~2,60 €) l'entrée du site (certaines sources indiquent 15-25 CNY selon la période)",t:"Arrivez tôt le matin pour éviter la chaleur et la foule sur les ~800 marches (env. 15 min jusqu'à la grotte de la Lune, 10 min de plus pour le sommet) ; la meilleure lumière pour les photos est en fin d'après-midi vers 16h jusqu'au coucher du soleil."},{n:"Xingping",p:"Gratuit (village/vieille ville en accès libre ; le point de vue de Xianggong Hill peut être payant selon accès)",t:"Pour le fameux point de vue du billet de 20 RMB, allez tôt le matin (7h-8h30) sur Xianggong Hill afin d'avoir une place sur la plateforme ; accessible en bus depuis la gare routière de Yangshuo (départs toutes les 20 min, ~10 CNY)."}],days:[
   {n:20,dt:"2 nov",sp:["Reed Flute Cave","Colline de la Trompe d'Éléphant"],t:"Arrivée Guilin · Reed Flute Cave & colline de la Trompe d'Éléphant."},
   {n:21,dt:"3 nov",sp:["Croisière rivière Li (Guilin → Yangshuo)"],t:"Croisière rivière Li, Guilin→Yangshuo, journée complète (~4-5h)."},
   {n:22,dt:"4 nov",sp:["Moon Hill"],t:"Yangshuo : campagne à vélo, rizières, Moon Hill, rivière Yulong."},
   {n:23,dt:"5 nov",sp:["Xingping"],t:"Xingping : point de vue du billet de 20 yuans · radeau de bambou."},
   {n:24,dt:"6 nov",sp:["West Street Yangshuo"],t:"Yangshuo : cuisine ou escalade · spectacle Impression Sanjie Liu."},
   {n:25,dt:"7 nov",t:"Yangshuo : journée détente, montage vidéo des rushes."},
   {n:26,dt:"8 nov",t:"Transfert Yangshuo→Guilin, derniers achats/logistique."},
   {n:27,dt:"9 nov",t:"Guilin : vol direct Guilin→Fukuoka, fin de l'étape Chine."}]},

{id:"jp",fl:"🇯🇵",nm:"Japon",tag:"",col:"#cf9166",photo:null,

route:"Fukuoka → Nagasaki → Kumamoto & Aso → Hiroshima & Miyajima → Kyoto & Nara → Tokyo",
visa:"Aucun visa, séjour libre 90 jours. 🆕 Visit Japan Web (gratuit, recommandé) : à remplir en ligne → QR code = passage immigration/douane plus rapide (vjw-lp.digital.go.jp). JR Pass 21 j (~600 €/pers) à acheter AVANT le départ.",
film:"Torii de Fushimi Inari à 5h30 · bambous d'Arashiyama avant 7h · torii flottant de Miyajima au coucher · yatai de Nakasu · érables koyo de Kyoto (Daitoku-ji, Jojakko-ji).",
note:"Pays le plus cher — réserver les hébergements tôt, surtout période koyo (mi-novembre).",
blocks:[
  {c:"Fukuoka",dd:"9–11 nov · 3j",co:[33.5904,130.4017],resto:[{n:"ShinShin (Tenjin, près de Nishitetsu Fukuoka)",p:"฿ ramen-ya (env. 800-1000¥)",t:"Commandez le ramen tonkotsu classique avec nouilles fines 'kaedama' (rab de nouilles) — issu des yatai à l'origine, c'est l'une des adresses les plus citées par les locaux et les blogs récents comme référence du vrai Hakata ramen."},{n:"Yatai de Nakasu (bord de la rivière Nakagawa, ex. stands comme Tsunatsuna)",p:"฿-฿฿ street food (stands ouverts dès 18h)",t:"Faites une tournée de 2-3 stands le long du fleuve, chacun avec 7-8 places seulement — testez le ramen, les yakitori et pour les plus curieux les abats grillés (motsuyaki) chez les 'neo-yatai' récents."},{n:"Yanagibashi Rengo Ichiba (marché couvert des pêcheurs)",p:"฿฿ marché/cantines de poissonniers",t:"Surnommé 'la cuisine de Fukuoka', ce marché à 15 min à pied de Hakata regorge de petites cantines où déguster sashimi ultra-frais et mentaiko (œufs de colin épicés) directement chez les producteurs, dès 8h en semaine."},{n:"Hakata Motsunabe Ooyama",p:"€€ restaurant (fondue à partager)",t:"Goûtez le motsunabe (fondue d'abats de bœuf mijotés au bouillon miso ou soja avec chou et ciboule) — Ooyama fait partie du top 5 des motsunabe recommandés par les locaux, avec plusieurs adresses près de Hakata Station et Tenjin."}],spots:[{n:"Yatai de Nakasu",p:"Gratuit à l'entrée (pas de billet) — compter ~1 500 à 3 000 ¥/pers. pour un repas avec une boisson (~9 à 18 €)",t:"Arrivez entre 18h et 18h30 pour être sûr d'avoir une place, car l'attente grimpe à 20-45 min le soir dans ce quartier très touristique ; prévoyez du cash et enchaînez plutôt 2-3 yatai (chacun impose une consommation minimum) plutôt que de rester au même."},{n:"Temple Kushida",p:"Gratuit (accès au sanctuaire) — le pavillon du trésor/musée est en option à ~300 ¥ (~1,80 €)",t:"Le sanctuaire est ouvert 24h/24 et gratuit ; venez plutôt entre 7h et 9h pour la belle lumière du matin et éviter les groupes, et notez que le pavillon du trésor est fermé le lundi."},{n:"Parc Ohori",p:"Gratuit — seul le Jardin japonais à l'intérieur du parc est payant, ~250 ¥ adulte / ~120 ¥ enfant (~1,50 € / ~0,75 €)",t:"Privilégiez une visite en semaine tôt le matin pour profiter du grand chemin de 2 km autour de l'étang presque désert ; accès direct par la station de métro Ohori Kōen (ligne Kūkō), sortie 3, et le Jardin japonais est fermé le lundi."},{n:"Château de Fukuoka",p:"Gratuit (site en plein air dans le parc Maizuru, sans billet)",t:"Les ruines sont accessibles 24h/24 toute l'année ; montez jusqu'au donjon en fin de journée pour profiter du coucher de soleil sur la ville, et visez fin mars/début avril pour les cerisiers en fleurs qui entourent le site."}],days:[
   {n:1,dt:"9 nov",sp:["Yatai de Nakasu"],t:"Arrivée depuis Guilin, installation. Ramen Hakata, puis stands de rue (yatai) de Nakasu en soirée."},
   {n:2,dt:"10 nov",sp:["Temple Kushida","Parc Ohori","Château de Fukuoka"],t:"Temple Kushida · Canal City · parc Ohori et ruines du château de Fukuoka."},
   {n:3,dt:"11 nov",sp:[],t:"Excursion à Dazaifu (Tenmangu) ou détente, puis train vers Nagasaki."}
  ]},
  {c:"Nagasaki",dd:"12–13 nov · 2j",co:[32.7503,129.8777],resto:[{n:"Shikairo (四海楼)",p:"€€ restaurant chinois, berceau du champon",t:"C'est ici, en 1899, qu'a été inventé le champon (nouilles, porc, fruits de mer et légumes dans un bouillon riche) — commander le champon original, idéalement avec vue sur le port depuis les étages supérieurs."},{n:"Kyokaen (京華園)",p:"€ restaurant chinois de quartier, Chinatown",t:"Adresse discrète et appréciée des locaux juste devant la porte nord de Chinatown, à privilégier pour le sara udon (nouilles fines croustillantes nappées de sauce épaisse) plutôt que pour le champon."},{n:"Yossou (吉宗), succursale Hamamachi",p:"€€ restaurant traditionnel, depuis 1866",t:"La toute première maison spécialisée dans le chawanmushi au Japon : commander le chawanmushi signature (9 ingrédients) accompagné du mushizushi (sushi vapeur), spécialité unique de Nagasaki."},{n:"Hamanomachi Arcade (浜町アーケード)",p:"฿ street food / marché couvert",t:"Grande galerie marchande animée près de la gare et de Chinatown, parfaite pour grignoter sur le pouce des kakuni manju (petits pains vapeur au porc braisé) entre deux boutiques."}],spots:[{n:"Musée de la bombe atomique de Nagasaki",p:"200 ¥ adultes / 100 ¥ étudiants (~1,20 € / ~0,60 €), gratuit pour les moins de 6 ans",t:"Compter 2 à 3 heures de visite ; privilégiez tôt le matin ou en fin de journée pour éviter les groupes, et prévoyez du liquide car les cartes sont peu acceptées sur les petits sites culturels de Nagasaki."},{n:"Parc de la Paix",p:"Gratuit (accès libre au parc, ouvert 24h/24)",t:"Accessible en 10 min de tram (lignes 1 ou 3) depuis la gare de Nagasaki, arrêt Heiwa-Koen ; portez de bonnes chaussures car le site est en pente avec escaliers, et gardez une attitude respectueuse et silencieuse sur ce site mémoriel."},{n:"Pont Megane",p:"Gratuit (accès libre, ouvert 24h/24)",t:"Comptez 30 à 45 minutes pour admirer le pont et chercher les pierres en forme de cœur dans les murs de la rivière ; visitez tôt le matin (avant 9h) ou après 18h en été pour éviter la chaleur et profiter d'une lumière idéale pour les photos."},{n:"Mont Inasa",p:"Téléphérique aller-retour environ 1 250 ¥ adultes (~7,50 €), aller simple ~730 ¥ (~4,40 €)",t:"Montez environ 30 minutes avant le coucher du soleil pour profiter de la transition jour/nuit sur ce site classé parmi les plus belles vues nocturnes du monde, et prévoyez une petite laine car le sommet est venteux et frais même en été."}],days:[
   {n:4,dt:"12 nov",sp:["Musée de la bombe atomique de Nagasaki","Parc de la Paix"],t:"Musée de la bombe atomique & Parc de la Paix (matinée de recueillement)."},
   {n:5,dt:"13 nov",sp:["Pont Megane","Mont Inasa"],t:"Dejima · pont Megane · Chinatown ; mont Inasa au coucher du soleil, puis train vers Kumamoto."}
  ]},
  {c:"Kumamoto & Aso",dd:"14–15 nov · 2j",co:[32.8032,130.7079],resto:[{n:"Kumamoto Ramen Kokutei (Honten)",p:"฿ street food / cantine locale",t:"Commander le ramen tonkotsu classique avec l'huile d'ail noir grillée (mayu) signature de Kumamoto, à deux pas de la gare — institution locale plébiscitée par les blogs voyage 2024-2025."},{n:"Yatai-mura (village de stands, quartier Shimotori)",p:"฿-฿฿ marché / stands de rue",t:"S'installer dans l'un des ~17 petits stands regroupés pour goûter basashi (sashimi de cheval) et karashi renkon (lotus frit à la moutarde piquante), spécialités emblématiques de Kumamoto, dans une ambiance conviviale typique."},{n:"Umazakura Shimotori",p:"€€ restaurant spécialisé viande de cheval",t:"Référence locale pour le basashi haut de gamme à base de cheval japonais, à commander en assortiment (moriawase) pour comparer les morceaux — recommandé dans les guides récents comme l'adresse la plus sérieuse pour ce plat."},{n:"Katsuretsutei Shinshigai Honten",p:"€€ restaurant (tonkatsu)",t:"Commander le tonkatsu classique, réputé pour sa panure fine et sa viande fondante — valeur sûre citée dans plusieurs classements 2025 des meilleures tables de Kumamoto, loin des pièges à touristes."}],spots:[{n:"Château de Kumamoto",p:"800 JPY (~4,80 €)",t:"En semaine, seule l'entrée sud est ouverte (l'entrée nord n'ouvre que le week-end et les jours fériés) et il faut souvent patienter aux caisses, donc prévoyez large ; une partie du château reste encore fermée suite au séisme de 2016, mais un tour gratuit relie le parking Josaien à l'enceinte."},{n:"Mont Aso (cratère du Nakadake)",p:"Accès au plateau gratuit ; navette obligatoire jusqu'au cratère environ 500-700 JPY (~3-4 €) l'aller + parking ~500-1000 JPY (~3-6 €)",t:"L'ouverture du cratère dépend du niveau d'alerte volcanique (gaz toxiques) et peut fermer du jour au lendemain, donc vérifiez le statut sur le site officiel de la préfecture le matin même avant de partir."},{n:"Caldeira d'Aso",p:"Gratuit (parking gratuit ou payant selon les points de vue)",t:"Visez le lever du soleil, surtout en automne entre 6h30 et 8h, pour espérer voir la fameuse mer de nuages (unkai) depuis un belvédère comme Daikanbo ; l'accès se fait surtout en voiture (Milk Road), le réseau de bus étant limité."},{n:"Kusasenri",p:"Gratuit (parking ~500 JPY/~3 € au lot principal, gratuit sur la route haute près de l'observatoire)",t:"Accessible en ~30 min de bus depuis la gare d'Aso, cette prairie reste ouverte 24h/24 et se visite librement même quand le cratère voisin est fermé pour raisons de sécurité."}],days:[
   {n:6,dt:"14 nov",sp:["Château de Kumamoto"],t:"Château de Kumamoto (partiellement reconstruit) · jardin Suizen-ji."},
   {n:7,dt:"15 nov",sp:["Mont Aso (cratère du Nakadake)","Caldeira d'Aso","Kusasenri"],t:"Journée au mont Aso : caldeira, cratère du Nakadake (selon l'alerte volcanique), prairies de Kusasenri."}
  ]},
  {c:"Hiroshima & Miyajima",dd:"16–18 nov · 3j",co:[34.2957,132.3197],resto:[{n:"Hassei (八昌)",p:"¥ okonomiyaki, cantine locale",t:"Adresse chaleureuse très prisée des Hiroshimais, à commander : l'okonomiyaki classique avec double nouilles (soba) et œuf, cuit devant vous sur la plancha."},{n:"Anago-meshi Ueno Miyajimaguchi Honten (あなごめしうえの)",p:"€€ restaurant traditionnel (env. 2200-3080 ¥)",t:"Institution centenaire (depuis 1901) juste à côté de l'embarcadère du ferry pour Miyajima, à commander : l'anago-meshi, riz recouvert d'anguille de mer grillée, plat signature qui a inventé la recette."},{n:"Yakigaki no Hayashi",p:"¥¥ stand/restaurant de fruits de mer",t:"Référence locale pour les huîtres de Miyajima, à commander : les huîtres grillées (yakigaki) juste sorties du gril, à déguster sur place entre le débarcadère et le sanctuaire Itsukushima."},{n:"Mame-tanuki",p:"¥¥ izakaya locale",t:"Un des rares restaurants de Miyajima ouvert tard le soir (après 21h), à commander : les huîtres frites et le bol d'anguille, à prix raisonnables loin des attrape-touristes du bord de mer."}],spots:[{n:"Mémorial de la Paix d'Hiroshima (Musée)",p:"200 ¥ (~1,25 €) adulte ; 100 ¥ pour lycéens/65 ans+ ; gratuit pour collégiens et moins",t:"Réservez un créneau en ligne à l'avance : la première heure et les 90 dernières minutes de la journée sont réservées aux détenteurs de réservation pour limiter l'affluence ; comptez 2 à 3h de visite."},{n:"Dôme de Genbaku (A-Bomb Dome)",p:"Gratuit (monument extérieur, pas de visite intérieure possible)",t:"Venez tôt le matin ou en fin de journée pour une lumière plus douce et moins de monde, et respectez le lieu de mémoire (drones interdits dans le parc)."},{n:"Torii de Miyajima (Grand Torii flottant)",p:"Gratuit (accès libre à tout moment, aucun billet)",t:"Consultez un tableau des marées avant de venir : à marée haute le torii semble flotter (effet carte postale, idéal 1-2h autour du pic), à marée basse (moins de 40cm) vous pouvez marcher jusqu'à sa base sur le sable — évitez juste d'être surpris par le retour rapide de l'eau."},{n:"Sanctuaire d'Itsukushima",p:"300 ¥ (~1,90 €) sanctuaire seul, ou billet combiné avec le Trésor (Treasure Hall) à 500 ¥ (~3,15 €) adulte",t:"Arrivez tôt le matin avant l'afflux des groupes venus par ferry pour profiter du site plus calmement ; le billet combiné s'achète uniquement à l'entrée du sanctuaire."},{n:"Mont Misen",p:"Téléphérique (ropeway) : 2 000 ¥ (~12,60 €) aller-retour adulte / 1 100 ¥ aller simple ; 1 000 ¥ aller-retour enfant. La randonnée à pied jusqu'au sommet est gratuite",t:"Le dernier tronçon du téléphérique dépose près du sommet mais il reste ~30 min de marche à pied jusqu'au point culminant ; dernière descente vers 16h30, donc prévoyez votre timing si vous comptez voir le coucher de soleil."}],days:[
   {n:8,dt:"16 nov",sp:["Mémorial de la Paix d'Hiroshima (Musée)","Dôme de Genbaku (A-Bomb Dome)"],t:"Parc du Mémorial de la Paix : musée & Dôme de Genbaku ; okonomiyaki le soir."},
   {n:9,dt:"17 nov",sp:["Torii de Miyajima (Grand Torii flottant)","Sanctuaire d'Itsukushima"],t:"Ferry pour Miyajima : torii flottant, sanctuaire d'Itsukushima ; nuit sur l'île."},
   {n:10,dt:"18 nov",sp:["Mont Misen"],t:"Mont Misen au lever du jour (téléphérique + marche), torii au lever du soleil ; train vers Kyoto."}

  {c:"Kyoto & Nara",dd:"19–26 nov · 8j (koyo)",co:[35.0116,135.7681],resto:[{n:"Marché Nishiki (Nishiki Ichiba)",p:"฿ street food / marché couvert",t:"Déambule entre les 130 échoppes vieilles de 400 ans et goûte le yuba (peau de tofu), les brochettes de tako tamago (poulpe-œuf de caille) et les takoyaki géants — la 'cuisine de Kyoto' par excellence, à manger sur le pouce devant l'étal."},{n:"Nakatanidou (中谷堂)",p:"฿ street food / pâtisserie",t:"Près de l'étang Sarusawa à Nara : commande le yomogi mochi (mochi à l'armoise fourré haricot rouge) juste après le show de pilage ultra-rapide au maillet, à manger chaud sur place."},{n:"Omen Kodaiji (à Higashiyama, Kyoto)",p:"€€ restaurant local",t:"Institution de quartier réputée pour ses udon épais servis avec un bol de légumes et sauce sésame à tremper soi-même — bien plus authentique que les enseignes à touristes de Gion toute proche."},{n:"Awa Naramachi",p:"€€ restaurant local (machiya)",t:"Dans une maison traditionnelle de 140 ans à Naramachi (Nara) : mise en avant des légumes anciens japonais, une adresse citée par les blogs récents pour son cadre authentique loin des attrape-touristes."}],spots:[{n:"Fushimi Inari-taisha",p:"Gratuit",t:"Le sanctuaire est ouvert 24h/24 ; venez avant 8h ou en fin d'après-midi pour éviter la foule, surtout sur les premiers torii près de l'entrée. Comptez 2-3h si vous montez jusqu'au sommet du mont Inari (le sentier se vide beaucoup après le 4e croisement)."},{n:"Forêt de bambous d'Arashiyama",p:"Gratuit",t:"L'allée principale est accessible librement 24h/24, mais la foule est maximale entre 11h et 15h : venez avant 8h ou après 18h pour des photos sans monde. Les sites voisins comme le Tenryu-ji ou l'Okochi-Sanso sont, eux, payants séparément."},{n:"Kinkaku-ji",p:"500 JPY (~2,90 €) adulte, 300 JPY (~1,75 €) enfant",t:"Le paiement se fait uniquement en espèces (pas de CB, pas de distributeur à proximité) et le billet, en forme d'amulette omamori, sert de joli souvenir. Aucune réservation possible, mais l'attente reste courte même en haute saison ; la visite (sens unique imposé) prend 30 à 45 minutes."},{n:"Parc de Nara",p:"Gratuit",t:"L'accès au parc et aux daims est libre ; les galettes à leur donner (shika senbei) coûtent environ 200 JPY (~1,15 €) le paquet en journée. Rangez cartes, papiers et sacs plastiques avant d'approcher les daims, certains peuvent mordiller ou donner un coup de tête pour réclamer à manger."},{n:"Tōdai-ji",p:"800 JPY (~4,70 €) adulte, 400 JPY (~2,30 €) enfant (accès au Daibutsu-den/Grand Bouddha)",t:"Arrivez tôt le matin (ouverture dès 7h30 en été) pour éviter les groupes de cars ; le grand pilier percé d'un trou à la taille d'une narine du Bouddha est réputé porter chance à qui parvient à le traverser. Un billet combiné avec le Nigatsu-do ou le musée du temple existe pour approfondir la visite."},{n:"Daitoku-ji",p:"Gratuit pour flâner dans les allées du complexe ; sous-temples payants séparément (~400 JPY / ~2,35 € chacun, ex. Daisen-in, Zuiho-in, Ryogen-in)",t:"Le vaste complexe zen se visite librement à pied, mais chaque sous-temple avec jardin sec se paie individuellement et n'est pas toujours ouvert (rotation saisonnière) : vérifiez les horaires du jour avant de vous déplacer. Lieu beaucoup plus calme que les grands temples touristiques de Kyoto."},{n:"Jojakko-ji",p:"500 JPY (~2,90 €)",t:"Bien moins fréquenté que le reste d'Arashiyama, c'est un bon plan tôt le matin ou en automne pour les couleurs sans la cohue. La montée d'escaliers jusqu'à la pagode Tahoto offre une belle vue dégagée sur Kyoto, comptez 30-45 minutes de visite."}],days:[

  {c:"Tokyo",dd:"27 nov–5 déc · 9j",co:[35.6762,139.6503],resto:[{n:"Daiwa Sushi (大和寿司)",p:"€€ sushi-ya au marché de Toyosu (6600-12000¥/pers.)",t:"Petit comptoir de 10 places au cœur du marché aux poissons de Toyosu, prisé des locaux et des grossistes : arrivez avant 6h à l'ouverture pour éviter la queue et commander l'omakase (thon fondant, oursin crémeux) ; fermé le mardi, cash only."},{n:"Ameya Yokocho (アメ横)",p:"฿ marché / street food (quelques centaines de yens le snack)",t:"Rue-marché populaire d'Ueno, née du marché noir d'après-guerre, où l'on grignote en marchant menchi katsu, brochettes, fruits de mer frais et sucreries japonaises entre les étals de vêtements et d'épices."},{n:"Narukiyo",p:"€€ izakaya",t:"Izakaya animée à cuisine ouverte et menu qui change selon l'arrivage : idéal pour goûter une cuisine japonaise créative et conviviale loin des attrape-touristes, dans une ambiance de vraie soirée locale."},{n:"Menson Rage",p:"฿ ramen-ya (comptoir, quelques milliers de yens)",t:"Petite adresse de ramen en banlieue de Tokyo, citée chaque année par le Michelin pour son bouillon shoyu de haute volée : à commander sans hésiter, le ramen signature à la sauce soja."}],spots:[{n:"Quartier de Yanaka",p:"Gratuit (quartier en accès libre)",t:"Privilégiez la fin d'après-midi : les boutiques de la rue Yanaka Ginza n'ouvrent souvent qu'à 11h, puis terminez au coucher du soleil sur l'escalier Yuyake Dandan pour la lumière dorée sur le quartier."},{n:"Shimokitazawa",p:"Gratuit (quartier en accès libre)",t:"Venez en semaine pour éviter l'affluence (la plupart des friperies n'ouvrent qu'entre 11h et midi) ; le premier dimanche du mois, de nombreuses boutiques vintage bradent leurs articles à moitié prix."},{n:"Marché extérieur de Tsukiji",p:"Gratuit (accès libre, on paie seulement ce que l'on achète)",t:"Arrivez entre 7h et 9h pour profiter des étals bien approvisionnés avant l'afflux de groupes vers 10h ; prévoyez du liquide (beaucoup de vendeurs n'acceptent pas la carte) et sachez que la plupart des échoppes sont fermées le dimanche."},{n:"Senso-ji (Asakusa)",p:"Gratuit (temple en accès libre)",t:"Visitez tôt le matin (6h-8h) ou en soirée pour éviter la foule sur l'allée commerçante Nakamise ; le temple et sa pagode restent illuminés jusqu'à 23h, une bonne option pour des photos sans monde."},{n:"Shibuya Crossing",p:"Gratuit (traversée et points de vue publics)",t:"Pour une vue en hauteur gratuite, montez au Sky Lobby du Shibuya Hikarie (11e étage, ouvert 24h/24) ; pour une vue payante depuis le sommet, Shibuya Sky coûte environ 2 200-2 500 JPY (~13-15 €) et se réserve en ligne à l'avance, surtout pour le coucher de soleil."},{n:"Nikko",p:"~1 600 JPY pour le sanctuaire Toshogu (~9-10 €) ; billet combiné avec le musée ~2 400 JPY (~14 €)",t:"Comptez une journée complète depuis Tokyo (environ 2h de train) ; réservez vos billets de train à l'avance en haute saison et arrivez tôt le matin pour devancer les bus de groupes devant le sanctuaire."}],days:[

  {c:"Chiang Mai",dd:"14–17 déc · 4j",co:[18.7883,98.9853],resto:[{n:"Huen Phen (เฮือนเพ็ญ)",p:"฿฿ restaurant familial nord-thaï",t:"Institution depuis plus de 40 ans, recette maison transmise en famille : commande le khao soi et le kaeng hang lay (curry de porc), unanimement cité parmi les meilleurs de la ville."},{n:"Khao Soi Khun Yai",p:"฿ street food / gargote",t:"Petite adresse cachée dans une ruelle, plébiscitée par les locaux pour son khao soi épais et crémeux surmonté d'huile pimentée — arrive systématiquement en tête des classements récents."},{n:"Khao Soi Mae Manee 2",p:"฿ street food",t:"Gargote toute simple mais distinguée par le guide Michelin, à choisir pour un khao soi authentique loin des circuits touristiques."},{n:"Chang Puak Gate Night Market — stand de la 'Cowgirl' (chapeau de cowboy)",p:"฿ marché de rue nocturne",t:"Le stand culte du marché de nuit de la porte Chang Puak : commande le khao kha moo (jarret de porc mijoté sur riz), une adresse fréquentée par les Chiang Maïens eux-mêmes chaque soir."}],spots:[{n:"Wat Chedi Luang",p:"~40 THB (~1,05 €)",t:"Le ticket est valable toute la journée, donc profitez-en pour revenir en fin d'après-midi quand la lumière dorée sublime le grand chedi et qu'il y a moins de groupes ; tenue couvrant épaules et genoux exigée."},{n:"Wat Phra Singh",p:"Gratuit",t:"L'accès aux jardins et au grand temple est libre, mais un don d'environ 20 à 40 THB (~0,60 €) est demandé pour entrer dans le Viharn Lai Kham où se trouve le Bouddha Phra Singh ; venez vers 6h-7h pour éviter la foule et la chaleur."},{n:"Wat Phra That Doi Suthep",p:"~30 THB (~0,80 €)",t:"Arrivez tôt le matin (avant 9h) pour éviter les cars de touristes et profiter d'une vue dégagée sur Chiang Mai ; comptez 309 marches à pied ou un petit funiculaire payant pour monter au sommet."},{n:"Doi Inthanon",p:"~300 THB (~7,80 €) pour les étrangers (adulte)",t:"Gardez votre ticket sur vous car il est redemandé à plusieurs postes de contrôle dans le parc ; les Deux Chedis (King & Queen) sont gérés séparément et facturent 100 THB supplémentaires, et il fait frais toute l'année en altitude donc prévoyez une veste."},{n:"Night Bazaar de Chiang Mai",p:"Gratuit",t:"Ouvert environ de 18h à 22h30 tous les jours, avec le plus grand choix le week-end ; le marchandage est de rigueur (commencez bien en dessous du prix annoncé) et privilégiez le paiement en espèces, car de nombreux stands n'acceptent pas la carte."}],days:[
   {n:1,dt:"14 déc",sp:["Wat Chedi Luang","Night Bazaar de Chiang Mai"],t:"Arrivée, quartier historique · Wat Chedi Luang · marché de nuit."},
   {n:2,dt:"15 déc",sp:["Wat Phra That Doi Suthep","Wat Phra Singh"],t:"Wat Doi Suthep au lever du jour · Wat Phra Singh · Night Bazaar."},
   {n:3,dt:"16 déc",sp:["Doi Inthanon"],t:"Doi Inthanon journée complète — cascades, pagodes jumelles, sommet."},
   {n:4,dt:"17 déc",t:"Cours de cuisine · sanctuaire d'éléphants éthique · préparatifs Chiang Dao."}]},
  {c:"Chiang Dao",dd:"18–20 déc · 3j",co:[19.3667,98.9667],resto:[{n:"Marché du mardi de Chiang Dao (Chiang Dao Tuesday Market, près de la gare routière)",p:"฿ street food / marché local",t:"Marché 100% local et pas touristique du tout : arrive avant 8h30 pour les fritures du matin, corn dogs thaïs, pad thaï et produits de montagne des ethnies des collines."},{n:"Stands du soir près du pont sur la rivière Ping (centre de Chiang Dao)",p:"฿ street food",t:"Le soir, les vendeurs installent leurs grills pour des viandes et saucisses thaïes (sai ua) grillées à emporter avec du riz gluant, une valeur sûre pour un dîner pas cher et authentique."},{n:"Pad Thai Baan Aladdin",p:"฿ street food",t:"Un pad thaï à l'ancienne, préparé dans la tradition, à partir de 35 bahts le plat : simple, bon marché et sans chichis."},{n:"Model Farm Cafe",p:"€ restaurant",t:"Restaurant adossé à un projet agricole bio local, réputé pour ses plats créatifs comme le canard fumé sauce tamarin (env. 130 bahts), une adresse plus élaborée mais toujours ancrée dans le terroir local."}],spots:[{n:"Grotte de Chiang Dao (Tham Chiang Dao)",p:"~40 THB (~1 €) l'entrée de base, + 200 THB (~5,20 €) par groupe pour la lanterne à gaz si vous explorez les galeries profondes avec un guide",t:"Négociez clairement le prix du guide et de la lanterne avant d'entrer (les 'dons' de 100-200 THB sont attendus mais pas obligatoires) ; venez tôt (ouverture 7h) pour éviter l'affluence, portez des vêtements couvrants et de bonnes chaussures car certains passages se font à quatre pattes."},{n:"Doi Luang Chiang Dao",p:"~200 THB (~5,20 €) l'entrée du parc/sanctuaire, + ~30 THB (~0,80 €) par véhicule",t:"L'ascension du sommet n'est autorisée que du 1er novembre au 31 mars, avec un quota strict de 150 randonneurs/jour et un guide obligatoire réservé plusieurs jours à l'avance auprès du bureau du parc ; hors saison, contentez-vous des sentiers plus bas ou du temple-grotte."},{n:"Wat Tham Pha Plong",p:"Gratuit",t:"Comptez 510 marches (20-30 minutes à l'ombre) bordées de naga jusqu'au temple perché ; habillez-vous décemment (épaules et genoux couverts, des sarongs sont prêtés sur place) et méfiez-vous de quelques chiens parfois peu commodes près de certaines zones du site."}],days:[
   {n:5,dt:"18 déc",t:"Transfert (1h30) · marché local · soirée au pied de la montagne sacrée."},
   {n:6,dt:"19 déc",sp:["Grotte de Chiang Dao (Tham Chiang Dao)","Doi Luang Chiang Dao"],t:"Grotte de Chiang Dao à la lampe à pétrole · randonnée sur le Doi Chiang Dao."},
   {n:7,dt:"20 déc",sp:["Wat Tham Pha Plong"],t:"Monastères troglodytes & rizières · villages Lisu/Shan · feu de camp."}]},
  {c:"Pai & Mae Hong Son",dd:"21–24 déc · 4j",co:[19.3583,98.4419],resto:[{n:"Charlie & Lek",p:"฿฿ restaurant thaï du nord (Walking Street)",t:"La référence khao soi à Pai, plein de locaux au déjeuner (signe qui ne trompe pas) — commandez le khao soi (60-90 THB) ou le curry vert."},{n:"Khao Soi Zister's",p:"฿฿ street food / gargote thaï du nord (Walking Street)",t:"Le concurrent direct de Charlie & Lek pour le khao soi selon les habitants, mais ferme vers 17h donc à faire au déjeuner."},{n:"Pai Walking Street Night Market",p:"฿ marché de nuit / stands multiples",t:"Arrivez entre 18h et 20h30 pour choper les plats fraîchement préparés : pad thaï, brochettes grillées, roti et mango sticky rice au fruit de la passion en face du Why Not Bar."},{n:"Santichon Yunnan Village",p:"฿฿ village chinois yunnanais (à 5 km à l'ouest, en scooter)",t:"Sortez de Pai pour un petit-déj différent : bao vapeur et thé yunnanais dans ce village fondé par des réfugiés chinois du Yunnan."}],spots:[{n:"Pai Canyon",p:"Gratuit (parking gratuit, pas de billet officiel ; toilettes ~5 THB)",t:"Venez à l'aube (vers 6h) pour avoir le canyon quasi désert, ou restez 30 min après le coucher du soleil pour les plus belles couleurs car la foule se masse entre 17h et 18h ; les crêtes sont étroites avec des à-pics de 30 m, prévoyez de bonnes chaussures."},{n:"Bua Thong Sticky Waterfalls",p:"Gratuit",t:"Ouvert de 8h à 17h ; la roche calcaire est volontairement rugueuse pour grimper pieds nus le long des cascades, venez tôt le matin pour éviter les groupes en minivan venus de Chiang Mai."},{n:"Sources chaudes de Tha Pai",p:"~300 THB pour les étrangers (~7,70 €) ; ~30-40 THB pour les Thaïlandais",t:"Le ticket donne aussi accès le même jour au parc national Huay Nam Dang voisin ; des bassins privés payants existent en plus des bassins publics, prévoyez une serviette et un maillot."},{n:"Wat Chong Kham (Mae Hong Son)",p:"Gratuit (dons bienvenus)",t:"Idéal au coucher du soleil pour voir la façade argentée se refléter sur le lac Jong Kham ; par respect des coutumes birmanes, certaines parties du temple sont interdites aux femmes."},{n:"Pont de bambou Su Tong Pae",p:"Gratuit (don conseillé au temple voisin pour l'entretien du pont)",t:"Arrivez vers 6h-6h30 pour assister à la tournée d'aumônes des moines et profiter de la lumière matinale sur ce pont de bambou d'environ 500 m ; chaussures confortables recommandées car le sol est irrégulier."},{n:"Grotte Tham Pla",p:"~100 THB pour les adultes étrangers (~2,60 €), ~50 THB pour les enfants",t:"Conservez votre ticket, valable le même jour pour le reste du parc national Namtok Pha Suea-Tham Pla ; ne touchez pas les carpes sacrées (mal vu localement) et privilégiez tôt le matin ou fin d'après-midi pour la lumière et moins de monde."}],days:[
   {n:8,dt:"21 déc",sp:["Pai Canyon"],t:"Transfert via Soppong · Pai Canyon au coucher du soleil."},
   {n:9,dt:"22 déc",sp:["Bua Thong Sticky Waterfalls","Sources chaudes de Tha Pai"],t:"Bua Thong Sticky Waterfalls · sources chaudes de Tha Pai · Walking Street."},

(Yaowarat)",p:"Gratuit",t:"Descendez à la station MRT Wat Mangkorn et arrivez vers 17h30-18h, avant que les stands les plus courus (huîtres, calamars grillés, riz gluant à la mangue) n'aient de longues files vers 19h-20h ; prévoyez du cash, la plupart des étals ne prennent pas la carte."},{n:"Marché flottant de Taling Chan",p:"Gratuit",t:"Le marché n'ouvre que le week-end (samedi-dimanche, environ 9h-16h) ; l'entrée est libre mais une balade en bateau sur les klongs coûte autour de 150-200 THB à négocier avant de monter, et gardez de petites coupures car les vendeurs sur les barques rendent rarement la monnaie."},{n:"Talad Rot Fai",p:"Gratuit",t:"Ouvert du mercredi au dimanche, 17h-minuit ; privilégiez le site de Ratchada (près du MRT Thailand Cultural Centre) pour l'accès facile et l'ambiance rétro avec voitures vintage, prévoyez du liquide en petites coupures pour marchander (démarrez autour de 60-70 % du prix annoncé)."}],days:[

  {c:"Koh Lanta",dd:"1–12 jan · 12j",co:[7.6167,99.0333],resto:[{n:"Saladan Night Market (Walking Street)",p:"฿ street food",t:"Le vrai spot local en fin d'après-midi/soirée (17h-22h) : brochettes satay, riz gluant à la mangue, poulet frit du sud, currys — tout se paie à partir de 20-30 baht, à picorer stand par stand."},{n:"Stands de fruits de mer grillés du quai de Saladan",p:"฿฿ street food / seafood stalls",t:"Poisson entier grillé, crevettes tigres et calamars fraîchement débarqués, moins scéniques que les restos de Long Beach mais bien plus frais et moins chers (poisson 200-350 ฿, crevette 80-120 ฿ pièce) — vas-y entre 19h et 21h quand la pêche du jour arrive sur le grill."},{n:"Marché ambulant (roadside market tournant, différent quartier chaque jour)",p:"฿ marché local",t:"Un marché nomade fréquenté par les habitants où des mama thaïes vendent pâtes de curry pilées maison, salade de mangue verte pilée et currys du sud typiques — demande où il se tient ce jour-là (change selon les jours) pour une expérience 100% locale."},{n:"Yang Garden",p:"฿฿ restaurant thaï de jardin",t:"Cadre jardin sous les palmiers avec bougies, réputé pour sa som tam (salade de papaye) et son pad kra pao ainsi que ses viandes grillées maison — le meilleur compromis entre authenticité et confort pour un dîner assis."}],spots:[{n:"Plage de Klong Dao",p:"Gratuit",t:"Privilégiez l'extrémité sud de la plage pour le meilleur coucher de soleil et installez-vous dans un bar de plage vers 17h pour l'happy hour ; attention aux méduses pendant la mousson (mai-octobre)."},{n:"Lanta Old Town",p:"Gratuit (musée local à donation libre)",t:"Explorez à pied depuis la jetée tôt le matin ou en fin d'après-midi pour la lumière dorée, et comptez une demi-journée pour flâner dans la rue principale et dîner dans un restaurant sur pilotis."},{n:"Parc national de Mu Ko Lanta",p:"~200 THB (~5,20 €) pour les étrangers adultes, ~100 THB (~2,60 €) enfants ; véhicule +20-30 THB",t:"Ouvert de 8h30 à 16h30, prévoyez des espèces sur place (pas toujours de carte) et grimpez jusqu'au phare de Laem Tanod, excellent point de vue pour le coucher de soleil."},{n:"Klong Nin Beach",p:"Gratuit",t:"Plage au fond sablonneux idéale pour nager, nettement plus calme que Long Beach ; le soir, les bars de plage installent des tables directement sur le sable, parfait pour un dîner au coucher du soleil."},{n:"Long Beach (Phra Ae)",p:"Gratuit",t:"Venez tôt le matin pour profiter du calme, la partie nord est plus animée (hôtels/restaurants) tandis que l'extrémité sud reste tranquille même en haute saison (novembre-avril)."}],days:[

  {c:"Koh Mook",dd:"13–24 jan · 12j",co:[7.3667,99.3000],resto:[{n:"Good Luck Restaurant",p:"฿฿ restaurant familial",t:"Tenu par une famille très accueillante, réputé comme l'une des meilleures tables de l'île pour le pad thai végétarien, la soupe coco-crabe et la salade de mangue au crabe."},{n:"Hilltop Restaurant",p:"฿฿ restaurant local",t:"Chef-patron Song aux fourneaux, ingrédients frais et plats maison souvent cités comme le meilleur rapport qualité-authenticité de Koh Mook."},{n:"Ma Ki Ni Cafe & Restaurant",p:"฿ petite cuisine ouverte",t:"Adresse toute simple sans décor mais aux odeurs qui ne trompent pas, pour des plats thaïs authentiques préparés minute."},{n:"Sugar's Coffee & Restaurant",p:"฿ street-food familial en bord de plage",t:"À faire pour les rouleaux de printemps croustillants et les curry-roti, les pieds dans le sable, loin des attrape-touristes."}],spots:[{n:"Tham Morakot (grotte émeraude)",p:"~200 THB (~5,20 €) - droit d'entrée du parc national Hat Chao Mai dont dépend la grotte (100 THB / 2,60 € pour les enfants)",t:"La lumière émeraude est la plus belle entre 10h et 14h ; il faut nager ~80 m dans un tunnel sombre (gilet et lampe fournis par le bateau) et la grotte est inaccessible à marée haute, donc vérifiez les horaires de marée et venez tôt, avant les bateaux d'excursion, en dormant sur l'île."},{n:"Farmer Beach (Haad Farang / Charlie's Beach, Koh Mook)",p:"Gratuit",t:"Accessible à pied depuis le village (~30 min) ou en moto-taxi (~50 THB / 1,30 €) ; c'est la meilleure plage de l'île pour le coucher de soleil, mais mieux vaut se baigner au centre de la plage car il y a des rochers sur le côté gauche."},{n:"Sivalai Beach",p:"Gratuit",t:"Ouverte à tous même sans loger au resort qui la borde ; venez à marée basse pour marcher sur la fameuse pointe de sable blanc (spot photo) et profiter d'une eau peu profonde idéale avec des enfants."},{n:"Koh Kradan",p:"~200 THB (~5,20 €) adulte étranger / ~100 THB (~2,60 €) enfant - entrée du Hat Chao Mai National Park (île incluse dans le parc)",t:"Prévoyez du cash, il n'y a ni distributeur ni gros village sur l'île ; partez tôt en excursion à la journée depuis Koh Mook pour profiter du récif corallien côté est avant l'arrivée des groupes de plongée/snorkeling."},{n:"Koh Ngai",p:"Gratuit (aucun billet pour la plage ; seul un tronçon de sentier au-delà de Paradise Beach appartient au Mu Koh Lanta National Park)",t:"Le meilleur snorkeling accessible depuis le sable se trouve près des rochers au sud de la plage principale et devant les plages Paradise/Muang, avec une eau calme et peu profonde idéale pour débutants et enfants ; allez-y à marée basse pour rejoindre le récif à pied."}],days:[

  {c:"Retour vers le Cambodge",dd:"25–27 jan · 3j",co:[8.0,98.9],spots:[{n:"Trang (ville et environs)",p:"Gratuit pour la ville ; ~200 THB (~5,20 €) pour la grotte d'Émeraude (Tham Morakot) ou des cascades comme Ton Yai",t:"Visitez la grotte d'Émeraude tôt le matin en haute saison (nov-avril) car il faut nager/traverser un tunnel de 20 m et la marée haute peut bloquer l'accès ; sinon la cascade Sai Rung est gratuite, multi-niveaux et bien moins fréquentée."},{n:"Krabi (ville et parcs nationaux)",p:"Gratuit pour la ville ; parcs nationaux/îles ~200 à 400 THB (~5,20 à 10,40 €) pour les étrangers selon le site",t:"Le marché nocturne Walking Street (gratuit) n'ouvre que vendredi à dimanche de 17h à 22h ; les frais des parcs nationaux (îles, grottes, sources chaudes) se paient en cash directement au ranger sur place, gardez donc du liquide."},{n:"Railay Beach",p:"Gratuit (plage et grotte de la Princesse) ; longtail boat Ao Nang-Railay ~100 THB (~2,60 €) l'aller, +50 THB après 18h",t:"Arrivez avant 9h pour profiter de Phra Nang Beach avant l'arrivée des excursions à la journée depuis Ao Nang et Krabi Town ; comptez 45-60 minutes de montée (avec cordes) pour le East Railay Viewpoint, la plus belle vue sur la baie."},{n:"Ao Nang",p:"Gratuit (plage)",t:"Achetez votre billet de longtail boat (~100 THB/~2,60 € l'aller) au ticket office du T-junction dès 8h pour Railay ou les 4 îles ; gardez du liquide car peu de vendeurs acceptent la carte, et négociez/confirmez toujours le prix des tuk-tuks avant de monter."}],days:[

blocks:[
  {c:"Phnom Penh",dd:"28–31 jan · 4j",co:[11.5564,104.9282],resto:[{n:"Marché Orussey (Phsar Orussey)",p:"฿ street food / marché",t:"Vas-y tôt le matin pour un bol de nom banh chok (nouilles de riz, sauce poisson-curry aux herbes) ou une portion de prahok ktiss (pâte de poisson fermenté au lait de coco) dans les petits étals familiaux — c'est là que les habitants du quartier mangent, pas les touristes."},{n:"Mr. Mab",p:"฿฿ street food / cantine locale",t:"Situé à Tuol Tom Pong (Boeung Keng Kang), c'est l'adresse pour goûter les classiques de rue khmers (porc grillé bai sach chrouk, salade verte, brochettes) dans un cadre simple mais fiable, très citée par les blogs food récents comme pont entre street food pure et confort."},{n:"Marché de nuit Phsar Reatrey (entre les rues 106 et 108, bord du Tonlé Sap)",p:"฿ street food / marché nocturne",t:"Coin restauration à l'arrière du marché avec tables communes façon pique-nique : calamars grillés, saucisses cambodgiennes, boulettes de poisson et brochettes — ambiance locale animée en soirée, loin des restaurants à touristes du front de mer."},{n:"Romdeng",p:"€€ restaurant khmer",t:"Restaurant-école qui forme d'anciens enfants des rues, réputé pour son amok au poisson et ses tarentules frites croustillantes ; cadre dans une villa coloniale avec jardin, cuisine khmer authentique validée par les locaux et non un simple attrape-touriste malgré sa notoriété."}],spots:[{n:"Musée du génocide Tuol Sleng (S-21)",p:"5 $ US (~4,60 €) l'entrée + 5 $ US (~4,60 €) l'audioguide en option (site officiel) ; certains guides annoncent un forfait à 6 $ US (~5,50 €) audioguide inclus",t:"Prenez impérativement l'audioguide, il rend la visite bien plus compréhensible et poignante ; comptez 1h30 à 3h sur place, en couvrant genoux et épaules, et idéalement visitez S-21 avant Choeung Ek pour suivre l'ordre chronologique des faits."},{n:"Choeung Ek (Killing Fields)",p:"6 $ US (~5,50 €), audioguide multilingue inclus",t:"Arrivez tôt le matin (ouverture 7h30) pour éviter la chaleur et la foule, comptez environ 1h30 de visite, et prévoyez un tuk-tuk aller-retour (~15-20 $) car le site est à 10 km du centre sans transport public direct ; paiement en espèces uniquement."},{n:"Palais Royal de Phnom Penh",p:"10 $ US (~9,20 €), en espèces uniquement (cartes non acceptées)",t:"Le palais n'ouvre que par créneaux (8h-11h puis 14h-17h) et peut fermer sans préavis pour des événements royaux, donc vérifiez avant d'y aller ; tenue stricte exigée (épaules et genoux couverts, pas de débardeur) et il faut se déchausser pour entrer dans la Pagode d'Argent et le Trône."},{n:"Marché russe (Psar Toul Tom Poung)",p:"Gratuit (marché sans billet d'entrée)",t:"Venez tôt le matin pour éviter la chaleur et la cohue, et négociez systématiquement en partant d'environ 50 % du prix annoncé ; attention aux contrefaçons et surveillez vos affaires dans les allées bondées, privilégiez du petit cash en riels ou dollars."}],days:[
   {n:1,dt:"28 jan",sp:["Marché russe (Psar Toul Tom Poung)"],t:"Arrivée du Cambodge, installation. Bord du fleuve (Sisowath Quay), marché russe."},
   {n:2,dt:"29 jan",sp:["Musée du génocide Tuol Sleng (S-21)"],t:"Tuol Sleng (S-21) le matin — un temps de digestion ensuite (pas Choeung Ek le même jour)."},
   {n:3,dt:"30 jan",sp:["Choeung Ek (Killing Fields)"],t:"Choeung Ek (Killing Fields) — visite forte, audioguide inclus."},
   {n:4,dt:"31 jan",sp:["Palais Royal de Phnom Penh"],t:"Palais Royal & Pagode d'Argent ; bus vers Siem Reap."}
  ]},
  {c:"Siem Reap & Angkor",dd:"1–5 fév · 5j",co:[13.3671,103.8448],resto:[{n:"Cuisine Wat Damnak (Chef Joannès Rivière)",p:"€€€€ restaurant gastronomique khmer-français",t:"Menu dégustation évolutif au marché du jour, considéré par plusieurs guides comme l'un des meilleurs restaurants d'Asie du Sud-Est — réserver plusieurs jours à l'avance, fermé dim/lun."},{n:"Malis Siem Reap",p:"€€ restaurant khmer traditionnel",t:"Prendre le samlor korko (ragoût de porc aux légumes) dans le cadre d'un jardin tropical apprécié des Cambodgiens autant que des voyageurs."},{n:"Genevieve's Restaurant",p:"€ restaurant khmer solidaire",t:"Amok de poisson et lok lak de bœuf simples et bien exécutés, projet à impact social qui forme et emploie des habitants du coin."},{n:"Stands de nouilles autour du Psar Chas / Old Market",p:"฿ street food",t:"Un bol de kuy teav (soupe de nouilles de riz aux os de porc, servi le matin) ou un lort cha (nouilles sautées à l'œuf) sur un tabouret en plastique, loin des néons de Pub Street."}],spots:[{n:"Angkor Wat",p:"Angkor Pass 1 jour 37$ / 3 jours 62$ / 7 jours 72$ (~34/57/66€), tarif unique valable pour tous les temples d'Angkor",t:"Pour le lever de soleil, achetez votre pass la veille et partez de l'hôtel avant 4h30 (ouverture des grilles à 5h) ; pour éviter la foule au bassin principal, tournez à droite vers le second bassin moins connu, ou entrez par la porte Est plutôt que la porte Ouest."},{n:"Bayon",p:"Inclus dans l'Angkor Pass (même billet qu'Angkor Wat, ~34€ pour 1 jour)",t:"Arrivez entre 7h et 7h30 par la porte Sud d'Angkor Thom pour atteindre Bayon avant l'afflux des groupes vers 9h ; la lumière rasante du matin met le mieux en valeur les visages sculptés."},{n:"Ta Prohm",p:"Inclus dans l'Angkor Pass (même billet, ~34€ pour 1 jour)",t:"Visitez avant 8h ou en fin d'après-midi pour photographier les célèbres arbres-racines (site du 'Tomb Raider') sans la foule des bus touristiques qui arrivent en milieu de matinée."},{n:"Banteay Srei",p:"Inclus dans l'Angkor Pass (même billet, ~34€ pour 1 jour)",t:"Ce temple est à ~25-30 km du centre, prévoyez donc du temps de trajet ; venez entre 7h30 et 9h ou après 15h30 pour profiter de la lumière dorée sur le grès rose et éviter les bus qui saturent le site en milieu de matinée."},{n:"Angkor Thom",p:"Inclus dans l'Angkor Pass (même billet, ~34€ pour 1 jour)",t:"Entrez par la porte Sud, la mieux conservée, bordée de 54 statues de dieux et démons illustrant le Barattage de la Mer de Lait ; combinez la visite avec Bayon situé au centre de l'enceinte, idéalement en tuk-tuk à la journée (20-25$)."},{n:"Phnom Bakheng",p:"Inclus dans l'Angkor Pass (même billet, ~34€ pour 1 jour)",t:"Le sommet est limité à 300 visiteurs à la fois pour le coucher de soleil (billet/laissez-passer distribué sur place, pas de réservation en ligne) : arrivez au pied de la colline avant 16h en haute saison pour être sûr d'obtenir une place."}],days:[

  {c:"Mondulkiri",dd:"6–10 fév · 5j",co:[12.4515,107.1877],resto:[{n:"Chomno Thmey (New Breeze Restaurant)",p:"฿ street food / cantine locale (2-5$)",t:"Institution khmère sans chichis ouverte depuis 21 ans où mangent les habitants (pas les touristes) : commande le porc frit au gingembre, frais et relevé, ou une soupe de nouilles."},{n:"Psar Sen Monorom (marché local, en contrebas de Hefalump Cafe)",p:"฿ marché / stands",t:"Vas-y tôt le matin pour voir les Bunong vendre fruits et légumes tout juste cueillis en forêt, et grignoter riz sauté ou nouilles préparées sur place — le meilleur aperçu du quotidien local."},{n:"Bamboo Cafe",p:"€ petit restaurant familial khmer/occidental",t:"Tenu par une famille dans un cadre verdoyant en plein centre-ville, idéal pour un amok ou un curry khmer bien exécuté à prix doux (2,50-4$)."},{n:"The Hangout",p:"€€ restaurant khmer/occidental",t:"Souvent cité comme la meilleure adresse toutes catégories de Sen Monorom, apprécié pour ses plats khmers copieux et ses alternatives végétaliennes bien faites."}],spots:[{n:"Cascade de Bou Sra",p:"~10 000 KHR / 2,50 $ (~2,30 €)",t:"Comptez 45-60 min de route goudronnée depuis Sen Monorom (env. 43 km) ; venez tôt le matin ou en semaine pour éviter les groupes, et privilégiez la saison sèche (déc.-mai) pour vous baigner dans les vasques, la saison des pluies pour un débit plus spectaculaire."},{n:"Sen Monorom",p:"Gratuit (ville, pas de billet d'entrée)",t:"Louez une moto (5-7 $/jour) pour rayonner vers les cascades et le sanctuaire d'éléphants, et montez à la colline sacrée de Doh Kramom en fin d'après-midi pour un coucher de soleil panoramique sur la ville et les collines."},{n:"Sanctuaire d'éléphants (Mondulkiri Project)",p:"~50 $ (~46 €) la journée (tarif officiel confirmé sur le site mondulkiriproject.org)",t:"Réservez plusieurs jours à l'avance via leur formulaire en ligne (confirmation sous 24h) car les groupes sont limités ; la formule inclut la marche avec les éléphants le matin, la baignade à la cascade et le déjeuner khmer l'après-midi, sans balade à dos d'éléphant (sanctuaire 100% éthique)."}],days:[
   {n:10,dt:"6 fév",sp:["Sen Monorom"],t:"Bus (~6h) vers Sen Monorom, collines de l'est ; installation, café d'altitude."},
   {n:11,dt:"7 fév",sp:["Sanctuaire d'éléphants (Mondulkiri Project)"],t:"Journée au sanctuaire d'éléphants éthique en forêt (marche avec les éléphants, pas de balade à dos)."},
   {n:12,dt:"8 fév",sp:["Cascade de Bou Sra"],t:"Cascade de Bou Sra · villages Bunong · plantations de café."},
   {n:13,dt:"9 fév",sp:[],t:"Randonnée / nature dans la jungle, ou journée de repos."},
   {n:14,dt:"10 fév",sp:[],t:"Route retour vers le sud (longue journée de bus)."}
  ]},
  {c:"Kep & Koh Rong Samloem",dd:"11–19 fév · 9j",co:[10.6053,103.3111],resto:[{n:"Marché aux Crabes de Kep (Psar Kdam)",p:"฿ marché / street food",t:"Choisissez votre crabe bleu vivant sur les étals face à la mer, faites-le peser puis cuisiner sur place au poivre vert de Kampot (environ 8$/kg + 2$ de cuisson), et dégustez-le 20 minutes plus tard sur les tables face au golfe de Thaïlande - l'expérience la plus authentique de Kep."},{n:"Holy Crab",p:"€€ restaurant",t:"Considéré comme le meilleur des restaurants de crabe de Kep (prix raisonnables, belle vue), commandez le 'Crab green pepper' ou le 'Crab in Kroeung'."},{n:"Kimly Restaurant",p:"฿ street food / local",t:"Adresse tenue par des locaux directement sur le marché aux crabes, réputée pour son crabe au poivre vert à prix doux, loin des tables les plus touristiques."},{n:"The Crab Kitchen",p:"€€ restaurant",t:"Très bien noté sur les avis récents pour son crabe au poivre de Kampot généreux et savoureux, dans une ambiance simple et décontractée."}],spots:[{n:"Marché aux crabes de Kep",p:"Gratuit",t:"L'accès au marché est libre, on ne paie que la nourriture (compter 7-9 $/kg de crabe, à négocier car le premier prix annoncé est souvent le double) ; venez tôt le matin ou au coucher du soleil pour éviter la chaleur et profiter de la meilleure ambiance."},{n:"Parc national de Kep",p:"~1 USD (~0,92 €) pour les non-Cambodiens (parfois non perçu tôt le matin)",t:"Partez tôt car les entrées ferment à 16h et le tour du sentier principal prend 3-4h (jusqu'à 6-7h avec les sentiers annexes) ; utilisez l'appli maps.me plutôt que Google Maps, certains chemins étant mal balisés ou envahis par la végétation."},{n:"Saracen Bay (Koh Rong Samloem)",p:"Gratuit",t:"Installez-vous plutôt dans la partie nord/centrale de la baie (sable le plus blanc, plus d'infrastructures) et évitez le sud-est encore en chantier ; le matin (8h-11h) offre l'eau la plus calme et la meilleure visibilité pour nager ou faire du snorkeling."},{n:"Île aux Lapins (Koh Tonsay)",p:"Gratuit sur l'île, mais ~8-10 USD (~7-9 €) l'aller-retour en bateau public depuis le port de Kep",t:"Achetez le billet de bateau au port de Kep ou via votre hébergement ; les départs publics ont lieu le matin (vers 9h, parfois aussi 13h) avec retour en fin d'après-midi (15h-16h), sinon un bateau privé coûte environ 25 $ l'aller-retour pour jusqu'à 6 personnes."}],days:[
   {n:15,dt:"11 fév",sp:["Marché aux crabes de Kep"],t:"Arrivée à Kep. Crabes au poivre de Kampot au marché aux crabes."},
   {n:16,dt:"12 fév",sp:["Parc national de Kep"],t:"Parc national de Kep (sentier en boucle, points de vue) ; coucher de soleil."},
   {n:17,dt:"13 fév",sp:["Île aux Lapins (Koh Tonsay)"],t:"Excursion à l'Île aux Lapins (Koh Tonsay), plage tranquille."},
   {n:18,dt:"14 fév",sp:["Saracen Bay (Koh Rong Samloem)"],t:"Bateau vers Koh Rong Samloem, installation à Saracen Bay."},
   {n:19,dt:"15 fév",sp:[],t:"Farniente, snorkeling ; bioluminescence la nuit (nager sans lune)."},
   {n:20,dt:"16 fév",sp:[],t:"Plages sauvages, kayak, sentiers dans la jungle."},
   {n:21,dt:"17 fév",sp:[],t:"Détente, baignade, ou baptême de plongée."},
   {n:22,dt:"18 fév",sp:[],t:"Journée libre plage / hamac."},
