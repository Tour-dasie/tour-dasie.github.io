blocks:[
  {c:"Saigon",dd:"22–25 fév · 4j",co:[10.8231,106.6297],resto:[{n:"Phở Phượng",p:"฿ street food (bol ~45 000-60 000 VND)",t:"Le pho nº1 selon Vietnam Coracle : bouillon mijoté aux épices (cannelle, badiane, girofle) par une famille du Nord installée depuis 30 ans, 25 Hoàng Sa, Đa Kao, District 1."},{n:"Bánh Mì Huỳnh Hoa",p:"฿ street food / sandwich (~55 000-70 000 VND)",t:"L'adresse culte du banh mi à Saigon : commande le 'đặc biệt' ultra garni (pâté, charcuteries, jambon, coriandre) et prévois de faire la queue, c'est le signe qu'il est frais et bon, 26 Le Thi Rieng, District 1."},{n:"Bún Bò Huế 14B",p:"฿ stand de rue (bol ~40 000-60 000 VND)",t:"Seul stand de bún bò Huế distingué au Bib Gourmand Michelin Vietnam 2025, bouillon épicé à la citronnelle sur la tranquille rue 46, District 4, loin des circuits touristiques."},{n:"Xôi Gà Number One",p:"฿ street food (petit-déj/en-cas, ~30 000-45 000 VND)",t:"Stand récompensé au Bib Gourmand 2025 : riz gluant au poulet effiloché, graisse de poulet parfumée et échalotes croustillantes, idéal pour un petit-déjeuner local authentique."}],spots:[{n:"Musée des vestiges de guerre (War Remnants Museum)",p:"40 000 VND (~1,45 €), gratuit pour les moins de 6 ans",t:"Arrivez tôt le matin (dès l'ouverture à 7h30) pour éviter les groupes de touristes ; comptez 1h30 à 2h de visite et prévoyez du liquide car le paiement à l'entrée se fait généralement en espèces uniquement."},{n:"Tunnels de Cu Chi",p:"125 000 VND (~4,55 €) pour le site de Ben Dinh, guide inclus ; gratuit pour les moins de 7 ans",t:"Partez le plus tôt possible (7h-8h) pour devancer les bus de groupe qui arrivent dès 10h, et privilégiez le site de Ben Duoc (un peu plus loin) qui est plus vaste et bien moins fréquenté que Ben Dinh."},{n:"Marché Ben Thanh",p:"Gratuit (entrée libre)",t:"Venez tôt le matin (7h-9h) pour un choix plus frais et moins de monde, payez en dongs plutôt qu'en dollars pour éviter la marge de change des vendeurs, et négociez en partant d'environ 50% du prix annoncé pour les vêtements et souvenirs."},{n:"Poste centrale de Saigon",p:"Gratuit",t:"Visitez plutôt en fin de journée ou tôt le matin car le lieu est bondé de groupes touristiques en fin de matinée et début d'après-midi ; combinez la visite avec la cathédrale juste en face pour une même sortie photo."},{n:"Cathédrale Notre-Dame de Saigon",p:"Gratuit",t:"L'édifice est en travaux de restauration de longue durée depuis plusieurs années : l'intérieur n'est généralement accessible qu'aux horaires de messe (8h-11h et 14h-16h), sinon on ne peut admirer que l'extérieur et le parvis."}],days:[

   {n:2,dt:"23 fév",sp:["Musée des vestiges de guerre (War Remnants Museum)","Poste centrale de Saigon","Cathédrale Notre-Dame de Saigon"],t:"Musée des vestiges de guerre · Poste centrale · Cathédrale Notre-Dame."},
   {n:3,dt:"24 fév",sp:["Tunnels de Cu Chi"],t:"Excursion aux tunnels de Cu Chi (demi-journée)."},
   {n:4,dt:"25 fév",sp:[],t:"Cholon (Chinatown), pagode Thien Hau ; bus/vol vers Da Lat."}
  ]},
  {c:"Da Lat",dd:"26–28 fév · 3j",co:[11.9404,108.4583],resto:[{n:"Nem Nướng Bà Hùng (328 Phan Đình Phùng)",p:"฿ street food / cantine locale",t:"Institution vieille de 20+ ans : commande le nem nướng cuốn (rouleaux de porc grillé à rouler soi-même dans la galette de riz avec crudités et sauce spéciale à base de foie), le plat signature de Da Lat."},{n:"Bánh Tráng Nướng 112 Nguyễn Văn Trỗi",p:"฿ street food / stand de rue",t:"LA référence locale pour la « pizza vietnamienne » : galette de riz grillée au charbon avec œuf de caille, viande hachée et fromage, à manger chaud en fin d'après-midi."},{n:"Chợ Đà Lạt (marché central) et Chợ Âm Phủ / Night Market attenant",p:"฿ marché / stands multiples",t:"Sur les marches du marché de nuit, goûte le xắp xắp (papaye verte, bœuf séché, foie, herbes) et le sữa đậu nành chaud, en te baladant entre stands le soir."},{n:"Bánh Tráng Nướng Dì Đinh (26 Hoàng Diệu)",p:"฿ street food / stand réputé",t:"Alternative tout aussi culte au 112 Nguyễn Văn Trỗi, souvent citée par les blogs food vietnamiens 2025 comme la plus authentique et généreuse en garniture."}],spots:[{n:"Gare de Da Lat",p:"~50 000 VND l'accès au site (~1,85 €) ; billet train touristique vers Trai Mat A/R ~108 000-150 000 VND (~4-5,50 €)",t:"Allez-y tôt le matin (premier départ vers 7h50) pour éviter les groupes de tour bus et profiter de la locomotive à vapeur et de l'architecture Art Déco au calme ; les billets de train s'achètent sur place le jour même."},{n:"Crazy House",p:"~80 000 VND (~2,90 €) pour les adultes (≥1,4 m) ; 30 000 VND (~1,10 €) pour 1,2-1,4 m ; gratuit en dessous",t:"Prévoyez 1 à 2 heures et de bonnes chaussures car les escaliers et passerelles étroits sont glissants par temps humide ; venez avant 17h30-18h (fermeture à 19h) et évitez les week-ends très fréquentés."},{n:"Lac Xuan Huong",p:"Gratuit",t:"Faites le tour à pied ou à vélo (location ~30 000-50 000 VND, environ 60-90 minutes pour les 5 km) tôt le matin ou au coucher du soleil pour une lumière et une fréquentation idéales ; restez à droite de la piste pour ne pas gêner cyclistes et piétons."},{n:"Chutes de Datanla",p:"~50 000 VND l'entrée (~1,85 €) ; luge alpine (Alpine Coaster) en option ~150 000-250 000 VND A/R (~5,50-9,25 €)",t:"Prenez la luge alpine (ascenseur/toboggan) pour descendre vers les chutes plutôt que de marcher, c'est l'attraction phare et elle évite la longue descente à pied ; arrivez tôt pour éviter les groupes organisés en milieu de journée."},{n:"Pagode Linh Phuoc",p:"Gratuit (dons bienvenus)",t:"Habillez-vous correctement (pas de short ni débardeur) et venez avant 10h pour devancer les bus de touristes ; comptez 1h-1h30 sur place, accessible en 15-20 min en Grab depuis le centre (~150 000 VND) ou en train touristique depuis la gare de Da Lat."}],days:[
   {n:5,dt:"26 fév",sp:["Lac Xuan Huong","Gare de Da Lat"],t:"Lac Xuan Huong, villas coloniales ; gare de Da Lat (Art déco) et train touristique de Trai Mat."},
   {n:6,dt:"27 fév",sp:["Crazy House","Pagode Linh Phuoc","Chutes de Datanla"],t:"Crazy House · pagode Linh Phuoc · chutes de Datanla (luge alpine)."},
   {n:7,dt:"28 fév",sp:[],t:"Moto tour Easy Rider avec chauffeur (plantations de café, cascades) ; vol vers Da Nang/Hoi An."}

  {c:"Hoi An",dd:"1–6 mars · 6j",co:[15.8801,108.3380],resto:[{n:"Bánh Mì Phượng",p:"฿ street food (env. 25-35k VND)",t:"Le banh mi le plus réputé du Vietnam (rendu célèbre par Anthony Bourdain) : commande le classique avec pâté, porc grillé, herbes fraîches et sauce maison, croustillant dehors moelleux dedans."},{n:"Thanh Cao Lầu (Thái Phiên / Trần Phú)",p:"฿ street food (40-60k VND le bol)",t:"Institution locale sans chichis pour le cao lầu authentique, préparé avec l'eau du puits Bá Lễ et les nouilles à la cendre de bois de Cham Island ; arrive avant 10h pour les nouilles les plus fraîches."},{n:"Cơm Gà Bà Buội",p:"฿ street food (35-45k VND)",t:"Vraie institution locale du riz au poulet effiloché (cơm gà), parfumé au safran et servi avec bouillon et papaye marinée."},{n:"Chợ Hội An (marché central, food court)",p:"฿ marché / stands",t:"Va au petit matin (ouvre à 6h) goûter côte à côte cao lầu, mì quảng, bánh xèo et white rose dumplings directement préparés par les vendeuses avec les produits frais du marché, prix imbattables."}],spots:[{n:"Vieille ville de Hoi An",p:"120 000 VND (~4,50 €)",t:"Billet valable pour 5 sites au choix (dont le Pont japonais). Explorer entre 6h30 et 8h30 : rues calmes, lumière douce, photos sans foule. Magique le soir avec les lanternes."},{n:"Pont couvert japonais",p:"Inclus dans le billet vieille ville",t:"Un des 5 sites du billet. Le photographier tôt le matin, avant l'affluence."},{n:"Village maraîcher de Tra Que",p:"~35 000 VND (~1,30 €)",t:"À 15 min à vélo de Hoi An. Tôt le matin pour voir les maraîchers au travail ; ateliers de cuisine possibles."},{n:"Plage d'An Bang",p:"Gratuit (transat ~50 000-100 000 VND sans conso)",t:"Tôt le matin (5h-8h) ou fin d'après-midi (coucher ~17h). Éviter 10h-15h en été (sable brûlant). Marcher vers le nord/sud pour du calme."},{n:"Sanctuaire de My Son",p:"150 000 VND (~5,60 €)",t:"Y aller dès l'ouverture ou en fin d'après-midi : peu de monde, moins de chaleur, belle lumière. Navette électrique incluse."}],days:[
   {n:8,dt:"1 mars",sp:["Vieille ville de Hoi An","Pont couvert japonais"],t:"Installation ; vieille ville de Hoi An la nuit (lampions), pont couvert japonais. Banh mi de Madame Phuong."},
   {n:9,dt:"2 mars",sp:["Sanctuaire de My Son"],t:"Excursion au sanctuaire de My Son (tôt le matin)."},
   {n:10,dt:"3 mars",sp:["Village maraîcher de Tra Que"],t:"Village maraîcher de Tra Que à vélo · atelier de cuisine (cao lau)."},
   {n:11,dt:"4 mars",sp:["Plage d'An Bang"],t:"Plage d'An Bang, détente ; couture sur mesure chez un tailleur."},
   {n:12,dt:"5 mars",sp:[],t:"Balade, cafés, lâcher de lanternes sur la Thu Bon en barque."},
   {n:13,dt:"6 mars",sp:[],t:"Journée libre ; route/vol vers Hue."}
  ]},
  {c:"Hue",dd:"7–9 mars · 3j",co:[16.4637,107.5909],resto:[{n:"Bun Bo Ba Tuyet",p:"฿ street food (env. 30 000 VND)",t:"Une gargote locale ouverte tôt le matin (6h-11h) réputée pour son bun bo Hue mijoté longuement, épicé et parfumé à la citronnelle — l'adresse citée en priorité par les blogs récents pour le plat emblématique de la ville."},{n:"Banh Khoai Lac Thien",p:"฿ street food / petit resto familial",t:"L'institution historique du banh khoai (crêpe croustillante fourrée porc-crevettes) servi avec une sauce aux cacahuètes maison unique en son genre, à tremper dans la sauce plutôt que le nuoc mam classique."},{n:"Hoa Dong (Com/Bun Hen chez Mme Hoa)",p:"฿ street food",t:"Gargote tenue depuis les années 1960 par trois générations, spécialisée dans le com hen et bun hen (riz ou vermicelles aux petites palourdes) — LE plat signature de Hue à goûter dans son adresse la plus authentique."},{n:"Marché Dong Ba",p:"฿ marché / street food",t:"Le meilleur endroit pour voir manger les habitants et grignoter en une seule halte com hen, banh beo, banh loc et bun thit nuong à des stands minuscules mais très fréquentés par les locaux."}],spots:[{n:"Citadelle de Hue",p:"150 000 VND (~5,60 €) ; combo 4 sites 530 000 VND (~19,80 €)",t:"Le combo (Citadelle + 3 tombeaux, valable 2 jours) économise ~120 000 VND. Visiter 7h-9h : frais et peu de groupes. Compter 4-5h, bonnes chaussures (grand site)."},{n:"Tombeau de Tu Duc",p:"150 000 VND, ou inclus dans le combo",t:"Le plus poétique (lac, pins). Prendre le combo si tu vois plusieurs tombeaux. Matinée pour éviter la chaleur."},{n:"Tombeau de Khai Dinh",p:"150 000 VND, ou inclus dans le combo",t:"Le plus spectaculaire (mosaïques, béton sculpté). Monter les marches pour la vue. À combiner via le combo."},{n:"Pagode Thien Mu",p:"Gratuit",t:"Au bord de la rivière des Parfums, jolie en fin d'après-midi ; accessible en bateau-dragon depuis Hue."},{n:"Marché Dong Ba",p:"Gratuit",t:"Grand marché local, à faire le matin. Négocier les prix et surveiller ses affaires (foule)."}],days:[
   {n:14,dt:"7 mars",sp:["Citadelle de Hue","Marché Dong Ba"],t:"Citadelle de Hue le matin (7h-9h) ; marché Dong Ba, cuisine impériale."},
   {n:15,dt:"8 mars",sp:["Tombeau de Tu Duc","Tombeau de Khai Dinh"],t:"Tombeaux impériaux : Tu Duc & Khai Dinh (billet combo, valable 2 jours)."},
   {n:16,dt:"9 mars",sp:["Pagode Thien Mu"],t:"Pagode Thien Mu en bateau-dragon sur la rivière des Parfums ; route vers Phong Nha."}
  ]},
  {c:"Phong Nha-Kẻ Bàng",dd:"10–12 mars · 3j",co:[17.5913,106.2833],resto:[{n:"Vung Hue Restaurant",p:"฿฿ restaurant local (env. 4-12$ / pers.)",t:"Juste à côté du centre des tickets de Phong Nha : commande les crevettes de la rivière Son sautées et l'anguille de rivière grillée au charbon, deux spécialités locales très citées par les blogs récents."},{n:"Bamboo Chopsticks",p:"฿฿ restaurant vietnamien traditionnel",t:"Vise le poulet façon Phong Nha (curcuma-citronnelle) et la carpe de la rivière Son, réputés pour leur authenticité par les voyageurs 2024-2025."},{n:"Chay Lap Restaurant (Chay Lap Farmstay)",p:"฿฿ table champêtre en pleine campagne",t:"Prends le plateau de poulet grillé ou la carpe braisée au galanga - cadre rizières + ingrédients frais du coin, loin des attrape-touristes du centre."},{n:"Stands de rue de fin d'après-midi le long de la route principale de Phong Nha",p:"฿ street food / bia hoi",t:"En fin de journée, les petits stands installés en bord de route (bún/pho, grillades, bière fraîche) sont l'option la plus locale et la moins chère, plébiscitée par les guides indépendants récents."}],spots:[{n:"Paradise Cave (Thien Duong)",p:"250 000 VND (~9,5 €)",t:"Arrivez dès l'ouverture (7h-8h) pour éviter les bus de groupes qui affluent en fin de matinée ; comptez 1h30 à 2h pour la visite, et prévoyez du liquide en dong car les cartes ne sont pas acceptées sur place."},{n:"Dark Cave (Hang Toi)",p:"450 000 VND (~16,5 €) en haute saison pour le pack complet (zipline + kayak + boue + grotte) ; ~250 000 VND (~9,5 €) en basse saison (mi-sept à fin février)",t:"Portez un maillot de bain sous vos vêtements (obligatoire, contrôlé à l'entrée) et sachez que la tyrolienne est interdite si vous pesez moins de 40 kg ou plus de 90 kg, auquel cas vous rejoignez la grotte en kayak."},{n:"Grotte de Phong Nha",p:"150 000 VND (~5,5 €) l'entrée avec la traversée en bateau sur la rivière Son incluse (billet seul à 80 000 VND si combiné avec Tien Son)",t:"Les billets s'achètent uniquement sur place à la gare des bateaux (pas de réservation en ligne) et se paient en espèces uniquement ; un pourboire de 50 000 à 100 000 VND pour le batelier est apprécié mais pas obligatoire."},{n:"Parc national de Phong Nha-Ke Bang",p:"Gratuit (pas de billet unique pour le parc, l'accès par la route est libre ; chaque grotte/activité a son propre tarif)",t:"Le parc se visite grotte par grotte plutôt que via une entrée globale : combinez idéalement Phong Nha et Paradise Cave sur la même journée en louant un scooter ou via un tour organisé depuis Son Trach, le village central."}],days:[
   {n:17,dt:"10 mars",sp:["Grotte de Phong Nha"],t:"Installation ; grotte de Phong Nha en barque sur la rivière Son."},
   {n:18,dt:"11 mars",sp:["Paradise Cave (Thien Duong)","Dark Cave (Hang Toi)"],t:"Paradise Cave illuminée · Dark Cave (tyrolienne, kayak & bain de boue)."},
   {n:19,dt:"12 mars",sp:["Parc national de Phong Nha-Ke Bang"],t:"Parc national (jungle, grottes) ; train de nuit vers Hanoi."}
  ]},
  {c:"Hanoi & Ninh Binh",dd:"13–19 mars · 7j",co:[21.0278,105.8342],resto:[{n:"Bún Chả Đắc Kim",p:"฿ street food (env. 50-70k VND)",t:"Institution vieille de plus de 50 ans au 1 Hàng Mành, recommandée par le Guide Michelin : commander le bun cha nem cua be (avec nem au crabe) accompagné de son bol de bouillon fumé et de porc grillé au charbon."},{n:"Phở Gia Truyền Bát Đàn",p:"฿ street food (env. 40-50k VND)",t:"Adresse culte au 49 Bát Đàn où l'on fait la queue dès l'aube pour un phở bò tái nạm (bœuf mi-cuit et tendon) au bouillon exceptionnel, servi jusqu'à épuisement des stocks."},{n:"Bún Chả Hương Liên",p:"฿-฿฿ restaurant simple (env. 100-150k VND)",t:"Devenu célèbre grâce à la visite d'Obama et Anthony Bourdain en 2016 (24 Lê Văn Hưu) : à essayer, le combo Obama exact avec bun cha et nem, dans une ambiance conviviale et sans chichi."},{n:"Marché Chợ Đồng Xuân (quartier des stands intérieurs)",p:"฿ marché / street food",t:"Le plus grand marché couvert du vieux quartier, parfait pour goûter en une seule visite bún riêu, bánh cuốn ou chè sur des petits stands fréquentés par les locaux, loin des zones à touristes."}],spots:[{n:"Lac Hoan Kiem",p:"Gratuit (le tour du lac est libre ; seul le Temple Ngoc Son sur l'île donne lieu à un billet : ~30 000 VND, ~1 €)",t:"Venez tôt le matin (avant 7h) pour voir les Hanoïens faire leur tadi-chi et profiter du calme ; la billetterie du temple Ngoc Son se trouve juste avant le pont rouge Thê Húc, ouvert 8h-18h."},{n:"Vieux quartier de Hanoi",p:"Gratuit (accès libre aux rues ; le marché de nuit se tient seulement le week-end)",t:"Le marché piéton (rues Hang Dao à Dong Xuan) n'ouvre que vendredi, samedi et dimanche de 18h à minuit, avec l'ambiance la plus animée entre 19h et 22h ; privilégiez la marche à pied plutôt que le taxi, l'accès étant limité en zone piétonne."},{n:"Trang An (Ninh Binh)",p:"~250 000-300 000 VND (~8-10 €) le billet bateau par personne",t:"Partez tôt (7h-8h30) pour naviguer avant l'arrivée des bus de Hanoi et éviter la foule ; comptez 2,5 à 3h de balade, paiement en espèces uniquement, et un pourboire au rameur (~50 000-100 000 VND par bateau) est apprécié."},{n:"Hang Mua",p:"~100 000 VND (~3,60 €) l'entrée adulte",t:"L'ascension compte environ 500 marches raides (~15 min), donc de bonnes chaussures sont indispensables ; venez au lever ou au coucher du soleil pour éviter la chaleur et la foule, avec une vue optimale sur les rizières de mai à juin (récolte)."},{n:"Tam Coc",p:"~250 000 VND (~9 €) le billet bateau par personne (barque privée solo ~500 000 VND)",t:"Achetez vos billets directement au guichet officiel (pas via l'hôtel, majoré de 15%, ni des vendeurs de rue) et prévoyez chapeau/eau car la balade dure environ 2h sans ombre ; un petit pourboire (20 000-50 000 VND) est courant pour les rameurs qui pagayent avec les pieds."},{n:"Temple de la Littérature",p:"~70 000 VND (~2,50 €) l'entrée adulte (35 000 VND étudiants, gratuit -15 ans)",t:"Visitez tôt le matin (7h30-9h) ou en fin d'après-midi pour la lumière et moins de monde, prévoyez au moins 1h de visite et de la monnaie en espèces (carte bancaire non acceptée à la billetterie)."}],days:[
   {n:20,dt:"13 mars",sp:["Lac Hoan Kiem","Vieux quartier de Hanoi"],t:"Lac Hoan Kiem, vieux quartier (36 corporations), bun cha chez Huong Lien."},
   {n:21,dt:"14 mars",sp:["Temple de la Littérature"],t:"Temple de la Littérature · musée d'ethnographie · train street (prudence)."},

   {n:23,dt:"16 mars",sp:["Hang Mua","Tam Coc"],t:"Ninh Binh : Hang Mua (marches, vue panoramique) & Tam Coc en barque."},

  {c:"Sapa",dd:"20–24 mars · 5j",co:[22.3364,103.8438],resto:[{n:"Marché de nuit de Sapa (Chợ đêm Sapa) — stands de grillades",p:"฿ street food (vendredi-dimanche, 16h-22h)",t:"Commande le buffet de brochettes grillées façon '3 Thang Grill' (une vingtaine de brochettes de viande/légumes + riz + achards, ~150-200k VND), l'ambiance y est très locale et vivante, surtout juste après le Têt."},{n:"A Quynh (Thắng Cố A Quỳnh)",p:"฿฿ restaurant local",t:"C'est l'adresse de référence pour le thắng cố, le ragoût de viande et abats aux herbes de montagne emblématique des minorités H'mong du Nord-Ouest — à accompagner d'un alcool de maïs local."},{n:"Cốn Sủi Ông Há",p:"฿ street food / gargote familiale",t:"Ouvert de l'aube au milieu d'après-midi, c'est LE spot pour le cốn sủi, des nouilles artisanales à base de farine de riz servies dans un bouillon parfumé, plat signature transmis en famille."},{n:"Étals des femmes Hmong/Dao près de l'Église en pierre (Nhà thờ đá Sapa)",p:"฿ street food ambulant",t:"Repère les vendeuses de minorités ethniques avec leurs paniers de gâteaux et de cơm lam (riz gluant cuit dans du bambou), un encas typique et authentique à grignoter en marchant."}],spots:[{n:"Village de Cat Cat",p:"~150 000 VND (~5,50 €)",t:"Arrivez vers 7h, avant les groupes de tour-opérateurs qui débarquent dès 9h30, et privilégiez un jour de semaine plutôt que le week-end pour profiter du village au calme ; paiement en espèces uniquement au guichet."},{n:"Mont Fansipan (téléphérique)",p:"~850 000 VND en semaine / ~900 000 VND le week-end (~30-33 €) l'aller-retour, funiculaire vers le sommet en supplément (~150 000 VND)",t:"Réservez le billet en ligne à l'avance pour éviter la file d'attente au guichet, et partez tôt le matin car les nuages recouvrent souvent le sommet dès la mi-journée, gâchant la vue depuis le point culminant."},{n:"Marché de Bac Ha",p:"Gratuit",t:"Le marché n'a lieu que le dimanche matin : venez entre 6h30 et 8h30 pour voir l'ambiance authentique avant l'arrivée des bus touristiques vers 10h30, et réservez votre transport (bus/voiture privée) au moins 24h à l'avance car les places partent vite."},{n:"Col de Tram Ton",p:"Gratuit",t:"Vérifiez la météo 2 à 3 jours avant : le col est souvent noyé dans le brouillard, donc privilégiez un lever de soleil ou la fin d'après-midi par temps clair pour la mer de nuages ; comptez environ 15 minutes en taxi depuis Sapa (~5 $)."},{n:"Rizières de Muong Hoa",p:"~75 000 à 150 000 VND selon le point d'entrée/checkpoint (~2,70-5,50 €)",t:"L'observation depuis la route (TL152) est gratuite, le ticket n'est demandé que pour entrer dans la vallée et les villages ; visez septembre-octobre pour les rizières dorées ou mai-juin pour les terrasses en eau, tôt le matin pour éviter la chaleur et la brume."}],days:[
   {n:27,dt:"20 mars",sp:["Village de Cat Cat","Rizières de Muong Hoa"],t:"Arrivée ; village de Cat Cat et rizières en terrasses de Muong Hoa."},
   {n:28,dt:"21 mars",sp:[],t:"Trek dans la vallée de Muong Hoa avec un guide Hmong, nuit chez l'habitant (homestay)."},

visa:"Visa à l'arrivée 30-40 $ ou e-visa (laoevisa.gov.la), 30 jours, extensible +30 j. ✅ Votre étape (29 j) tient dans le visa de base (1 j de marge).",
film:"Pha Daeng Peak (Nong Khiaw) à l'aube · cérémonie Tak Bat à Luang Prabang · vasques de Kuang Si · montgolfière sur Vang Vieng · Mékong au coucher depuis le bateau lent.",

blocks:[
  {c:"Vientiane",dd:"1–2 avr · 2j",co:[17.9757,102.6331],resto:[{n:"Kualao Restaurant",p:"€€ restaurant lao traditionnel",t:"Institution installée dans une villa coloniale, avec spectacle de danse le soir : à commander le laap, le mok pa (poisson en feuille de bananier) et le riz gluant pour un panorama complet de la cuisine lao."},{n:"Sihom Night Market (Hengboun Road)",p:"฿ street food / marché de nuit",t:"Plus local et moins touristique que le marché du Mékong, c'est là que mangent les Vientianais : viser les stands les plus fréquentés pour le khao piak sen (soupe de nouilles épaisses) et les grillades."},{n:"Lao Kitchen",p:"฿฿ street food / petit resto",t:"Adresse réputée sur Hengboun Road pour son laap (salade de viande hachée épicée) fait dans les règles, à prix mi-gamme, loin des versions édulcorées pour touristes."},{n:"Marché de nuit du Mékong (Chao Anouvong Night Market)",p:"฿ marché / stands street food au bord du fleuve",t:"À faire au coucher du soleil pour le tam mak hoong (salade de papaye pilée devant vous) et grignoter de stand en stand face au Mékong."}],spots:[{n:"Pha That Luang",p:"~30 000-40 000 LAK (~1,35-1,80 €) pour l'accès à l'enceinte du stupa",t:"Privilégiez le début de matinée (ouverture 8h) pour éviter la chaleur et la foule ; les temples et jardins autour du stupa doré sont en accès libre, seule l'enceinte intérieure est payante."},{n:"COPE Visitor Centre",p:"Gratuit (don bienvenu)",t:"Comptez 1 à 2h pour la visite, idéalement en semaine tôt le matin (ouvert 8h30-16h) ; ne manquez pas la salle de cinéma qui projette des témoignages sur les bombes à sous-munitions (UXO)."},{n:"Patuxai",p:"~3 000-5 000 LAK (~0,15-0,25 €) pour monter au sommet",t:"Les jardins autour de l'arc sont gratuits, seule la montée à la terrasse panoramique est payante en kip liquide ; montez plutôt en fin d'après-midi pour profiter de la vue sur la ville et du coucher de soleil."},{n:"Wat Si Saket",p:"~20 000-30 000 LAK (~0,90-1,35 €) pour les étrangers",t:"Venez tôt le matin pour voir les habitants prier et faire des offrandes aux moines ; tenue couvrant épaules/genoux obligatoire, chaussures à retirer et photos interdites à l'intérieur du sanctuaire aux 10 000 bouddhas."},{n:"Marché du matin de Vientiane (Talat Sao)",p:"Gratuit (accès libre aux stands)",t:"Allez-y entre 7h et 9h pour les produits frais et moins de monde (ouvert jusqu'à 16h-17h) ; prévoyez du liquide en kip et n'hésitez pas à marchander, surtout côté artisanat et textiles."}],days:[
   {n:1,dt:"1 avr",sp:["Pha That Luang","Patuxai"],t:"Arrivée du Vietnam ; Pha That Luang (stupa doré) et arc de Patuxai."},
   {n:2,dt:"2 avr",sp:["COPE Visitor Centre","Wat Si Saket","Marché du matin de Vientiane (Talat Sao)"],t:"COPE Visitor Centre (émouvant, bombes à sous-munitions) · Wat Si Saket · marché du matin ; bus vers Vang Vieng."}
  ]},
  {c:"Vang Vieng",dd:"3–5 avr · 3j",co:[18.9236,102.4480],resto:[{n:"Champa Night Market (Vang Vieng Walking Street)",p:"฿ street food / marché nocturne",t:"Arrivez vers 17h pour le coucher de soleil et goûtez le riz gluant grillé glacé au jaune d'œuf et au piment ainsi que les brochettes grillées - le rendez-vous incontournable des locaux chaque soir."},{n:"Chaixi Noodles",p:"฿ street food / petit resto",t:"La soupe de wontons au porc croustillant et à l'ail (environ 45 000 kip) est LA spécialité à commander, plusieurs fois citée comme un des meilleurs bouis-bouis de la ville."},{n:"Ban Lao",p:"฿-฿฿ restaurant local",t:"En plein cœur de Vang Vieng : commandez les nouilles au porc rouge ou les dim sum maison, adresse fréquentée surtout par des habitués locaux."},{n:"ຮ້ານເຂົ້າ ອາເຮຍ ('Pork Leg Rice')",p:"฿ street food",t:"Petite gargote quasi inconnue des touristes : le riz vapeur au jarret de porc fondant sauce aigre-douce (khao ka moo) est un délice authentique à petit prix."}],spots:[{n:"Blue Lagoon 1 (Vang Vieng)",p:"~10 000-20 000 LAK (~0,45-0,90 €)",t:"C'est la lagune la plus fréquentée des trois : viens dès l'ouverture (8h) ou après 15h pour éviter les bus touristiques qui arrivent vers 10h ; balançoire, plongeoirs et location de tubes sont en supplément."},{n:"Tham Phu Kham",p:"~10 000-20 000 LAK (~0,45-0,90 €), billet combiné avec Blue Lagoon 1",t:"La grotte surplombe directement la lagune et se visite avec le même billet ; prévois des chaussures fermées qui ne craignent pas l'eau et une lampe torche (location sur place ~10 000 LAK) pour dépasser la première salle avec le Bouddha couché."},{n:"Rivière Nam Song",p:"Gratuit (accès à la rivière) ; tubing ~100 000-150 000 LAK (~4,50-6,50 €), kayak ~240 000 LAK (~10,50 €)",t:"Privilégie la saison sèche (octobre à avril) où l'eau est plus claire et le courant moins dangereux ; la scène des bars de tubing s'est beaucoup calmée depuis la réglementation, l'expérience est aujourd'hui plus tranquille."},{n:"Point de vue Nam Xay",p:"~20 000 LAK (~0,90 €)",t:"Aucune réservation nécessaire, mais vas-y au lever du soleil pour être quasiment seul ou 1-2h avant le coucher du soleil pour éviter la chaleur ; sentier court (0,6 km) mais raide et glissant, prévois de bonnes chaussures et une lampe frontale si descente à la nuit tombante."}],days:[
   {n:3,dt:"3 avr",sp:["Rivière Nam Song","Blue Lagoon 1 (Vang Vieng)","Tham Phu Kham"],t:"Kayak/tubing sur la Nam Song · Blue Lagoon 1 & grotte Tham Phu Kham."},
   {n:4,dt:"4 avr",sp:["Point de vue Nam Xay"],t:"Montgolfière à l'aube (réserver 2-3 j avant) · point de vue Nam Xay au lever du soleil."},
   {n:5,dt:"5 avr",sp:[],t:"Détente, lagons à scooter ; bus panoramique vers Luang Prabang."}
  ]},
  {c:"Luang Prabang",dd:"6–13 avr · 8j",co:[19.8845,102.1348],resto:[{n:"Marché de nuit – buffet street food, rue Sisavangvong (à l'arrière du night market)",p:"฿ street food (0,80–2€/plat)",t:"Composez votre assiette au buffet végétarien tenu par une dizaine de mamies (légumes sautés, tofu, herbes fraîches, riz gluant) puis complétez avec une brochette ou du sai oua grillé — LE rituel local du soir, loin des pièges à touristes de la rue principale."},{n:"Tamarind",p:"€€ restaurant (10-20€/pers.)",t:"Référence de la gastronomie laotienne sur les bords de la Nam Khan : commandez le menu dégustation pour goûter l'or lam et le sai oua dans une version soignée mais fidèle aux recettes traditionnelles."},{n:"Bouang",p:"€ restaurant (cuisine fraîche et locale, bon rapport qualité-prix)",t:"Adresse très appréciée pour ses plats colorés et généreux et son service chaleureux — une valeur sûre plébiscitée par les voyageurs récents plutôt que par les groupes organisés."},{n:"Xieng Thong Noodle",p:"฿ street food / petite gargote locale",t:"Minuscule échoppe près du Wat Xieng Thong fréquentée surtout par les habitants : idéale pour un khao piak sen (soupe de nouilles laotienne) matinal, simple et authentique."}],spots:[{n:"Cascade de Kuang Si",p:"~60 000–65 000 LAK (~2,50–2,70 €)",t:"Arrivez avant 9h ou après 15h pour éviter les bus de groupe (le site est bondé en milieu de journée) ; le billet inclut aussi le sanctuaire de sauvetage d'ours Free the Bears, prévoyez maillot de bain pour les bassins turquoise."},{n:"Wat Xieng Thong",p:"~20 000–30 000 LAK (~0,80–1,20 €)",t:"Ouvert de 8h à 17h, billet à acheter au guichet de l'entrée sud ; venez en fin d'après-midi, la lumière rasante met en valeur la célèbre mosaïque de l'arbre de vie sur la façade ouest."},{n:"Mont Phousi",p:"~20 000–30 000 LAK (~0,80–1,20 €)",t:"Montez au moins 1h avant le coucher du soleil pour avoir une place au sommet (très fréquenté) ou tentez le lever du jour, bien plus calme ; environ 300 marches, prévoyez une lampe de téléphone pour la descente à la tombée de la nuit."},{n:"Marché de nuit de Luang Prabang",p:"Gratuit (accès libre, paiement uniquement si achats)",t:"Ouvert tous les soirs d'environ 17h à 22h-23h sur la rue principale piétonne ; ambiance détendue et vendeurs peu insistants, mais restez vigilant sur vos affaires (pickpocket occasionnel) et n'hésitez pas à marchander poliment."},{n:"Grottes de Pak Ou",p:"~20 000 LAK (~0,80 €) l'entrée des grottes + ~75 000 LAK/pers (~3 €) pour le bateau partagé aller-retour depuis Luang Prabang",t:"Partez tôt le matin (bateaux vers 8h30) pour profiter du trajet de 2h sur le Mékong avant la chaleur ; privilégiez un bateau partagé plutôt que privé (300 000 LAK) pour réduire le coût si vous êtes seul ou en petit groupe."}],days:[
   {n:6,dt:"6 avr",sp:["Wat Xieng Thong","Marché de nuit de Luang Prabang"],t:"Vieille ville (UNESCO), Wat Xieng Thong ; marché de nuit le soir."},
   {n:7,dt:"7 avr",sp:["Mont Phousi"],t:"Tak Bat à l'aube (aumônes aux moines — respect & distance) · mont Phousi au coucher du soleil."},
   {n:8,dt:"8 avr",sp:["Cascade de Kuang Si"],t:"Cascade de Kuang Si (bassins turquoise) & centre des ours sauvés."},
   {n:9,dt:"9 avr",sp:["Grottes de Pak Ou"],t:"Grottes de Pak Ou (milliers de bouddhas) en bateau sur le Mékong."},
   {n:10,dt:"10 avr",sp:[],t:"Cours de cuisine lao · villages de tisserands (Ban Xang Khong)."},

   {n:12,dt:"12 avr",sp:[],t:"Journée libre — Nouvel An lao (Pi Mai, mi-avril) : ambiance festive et batailles d'eau."},
   {n:13,dt:"13 avr",sp:[],t:"Bus/bateau vers Nong Khiaw."}
  ]},
  {c:"Nong Khiaw & Muang Ngoi",dd:"14–18 avr · 5j",co:[20.5667,102.6167],resto:[{n:"Marché du matin de Nong Khiaw (près du pont, sur la rive est)",p:"฿ street food / marché",t:"Vas-y tôt (6h-8h) : les vendeuses Khmu et Hmong descendues des villages y vendent brochettes, viande séchée, riz gluant (khao niao) et tam mak houng (salade de papaye épicée), ainsi que du ping pa, poisson du Nam Ou grillé aux herbes citronnées."},{n:"Coco Home Bar & Restaurant",p:"฿฿ restaurant local au bord de la rivière",t:"Commande le mok pa (poisson vapeur en feuille de bananier) ou la salade de papaye en terrasse jardin face au Nam Ou, idéal au coucher du soleil, et sans l'ambiance 'piège à touristes' des bars du centre."},{n:"Stands de sandwichs baguette près du marché/pont central",p:"฿ street food (environ 15 000 kip)",t:"Le sandwich baguette au poulet pané, chou croquant et fromage est bien meilleur marché qu'ailleurs au Laos et constitue un en-cas ou petit-déj typique très apprécié des voyageurs récents."}],spots:[{n:"Point de vue Pha Daeng Peak (Nong Khiaw)",p:"~20 000–50 000 LAK (~0,80–2 €), payé à un petit stand au pied du sentier",t:"Partez au plus tard à 6h30 pour arriver au sommet au lever du soleil et voir la mer de nuages ; prévoyez lampe frontale, 1,5-2L d'eau et restez strictement sur le sentier balisé (risque de munitions non explosées, UXO)."},{n:"Muang Ngoi Neua",p:"Gratuit (village sans billet d'entrée) ; le bateau depuis Nong Khiaw coûte ~70 000 LAK (~2,70 €) au guichet du quai",t:"Achetez votre billet directement au bureau du quai de Nong Khiaw plutôt que via une agence/guesthouse (souvent 100 000-120 000 LAK) ; les deux départs quotidiens sont vers 11h30 et 14h30, comptez 1h30-2h de trajet."},{n:"Grotte de Pha Tok",p:"~10 000 LAK (~0,40 €) l'entrée, + ~5 000 LAK (~0,20 €) pour la location d'une lampe torche",t:"Venez tôt le matin ou fin d'après-midi (chaleur étouffante à midi dans les passages étroits), portez de bonnes chaussures car le sentier est glissant, et apportez votre propre lampe pour économiser ; fermée en général pendant la saison des pluies."},{n:"Rivière Nam Ou",p:"Gratuit (accès libre à la rivière) ; kayak env. 15 $ (~14 €) la demi-journée, sortie bateau/excursion à partir de ~250 000 LAK/pers (~9,80 €)",t:"Privilégiez un départ matinal entre 7h et 10h pour éviter le vent l'après-midi, et visitez idéalement entre novembre et avril (saison sèche) pour une eau plus calme et un meilleur panorama sur les pitons karstiques."}],days:[
   {n:14,dt:"14 avr",sp:["Grotte de Pha Tok","Rivière Nam Ou"],t:"Installation ; grotte de Pha Tok (refuge de guerre), coucher de soleil sur la Nam Ou."},
   {n:15,dt:"15 avr",sp:["Point de vue Pha Daeng Peak (Nong Khiaw)"],t:"Point de vue Pha Daeng Peak au lever du jour (montée raide ~1h30-2h)."},
   {n:16,dt:"16 avr",sp:["Muang Ngoi Neua"],t:"Bateau vers Muang Ngoi Neua (accessible qu'en bateau) : village hors du temps."},
   {n:17,dt:"17 avr",sp:[],t:"Treks vers les villages Khmu, kayak, grottes ; retour à Nong Khiaw."},

/* ============ SYNCHRO CLOUD (Firebase Realtime Database) ============ */
let _pushT;
function setSyncPill(state){const d=document.getElementById('syncdot');if(d)d.className='syncdot '+state;}
function syncActive(){return !!(SYNC.user&&SYNC.dataRef);}
function pushCloud(now){
  if(!SYNC.dataRef||SYNC.applying)return;
  clearTimeout(_pushT);
  const doit=()=>{try{SYNC.dataRef.set({blob:JSON.stringify(S),_updatedAt:S._updatedAt||0});setSyncPill('on');}catch(e){setSyncPill('err');}};
  if(now)doit();else _pushT=setTimeout(doit,700);
}
function applyRemoteData(d){
  S={days:d.days||{},blocks:d.blocks||{},check:d.check||{},expenses:d.expenses||[],
     reminders:d.reminders||{},flights:d.flights||[],photos:d.photos||{},rates:d.rates||{},wishlist:d.wishlist||{},settlements:d.settlements||[],
     _updatedAt:d._updatedAt||Date.now(),_seed1:d._seed1||S._seed1};
}
/* fusion sans perte au 1er raccordement : on garde tout ce qui est coché des deux côtés */
function mergeStates(a,b){
  const m={days:{},blocks:{},check:{},reminders:{},photos:{},expenses:[],flights:[],rates:{},wishlist:{},settlements:[]};
  ['days','blocks','check','reminders'].forEach(k=>{m[k]=Object.assign({},a[k]||{});const bb=b[k]||{};
    for(const key in bb){if(bb[key])m[k][key]=true;else if(!(key in m[k]))m[k][key]=bb[key];}});
  m.photos=Object.assign({},a.photos||{},b.photos||{});
  const byId=arr=>{const o={};(arr||[]).forEach(x=>{o[x.id]=x;});return o;};
  m.expenses=Object.values(Object.assign(byId(a.expenses),byId(b.expenses)));
  m.flights=Object.values(Object.assign(byId(a.flights),byId(b.flights)));
  m.settlements=Object.values(Object.assign(byId(a.settlements),byId(b.settlements)));
  m.rates=Object.assign({},a.rates||{},b.rates||{});
  m.wishlist=Object.assign({},a.wishlist||{},b.wishlist||{});
  m._seed1=a._seed1||b._seed1;m._updatedAt=Math.max(a._updatedAt||0,b._updatedAt||0);
  return m;
}

function unlockUI(){document.body.classList.remove('locked');}
function initFirebase(){
  if(typeof firebase==='undefined'||!firebase.auth){
    $('#modal').innerHTML=`<div class="loginwrap"><div class="loginbox"><div class="lg-logo">📡</div>
      <h2>Connexion requise</h2><div class="lg-sub">Impossible de charger le carnet — vérifie ta connexion internet, puis recharge.</div>
      <button class="btn" onclick="location.reload()">Recharger</button></div></div>`;
    return;
  }
  try{
    if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
    SYNC.ready=true;
    firebase.auth().onAuthStateChanged(u=>{
      SYNC.user=u||null;
      if(u){unlockUI();renderAll();nav('today');setSyncPill('connecting');startSync();closeModal();}
      else{stopSync();lockUI();setSyncPill('off');showLogin();}
    });
  }catch(e){setSyncPill('err');}
}
function stopSync(){
  try{if(SYNC.dataRef)SYNC.dataRef.off();}catch(e){}
  SYNC.ref=null;SYNC.dataRef=null;SYNC.pushRef=null;SYNC.db=null;SYNC.first=true;
}
function startSync(){
 try{
    SYNC.db=firebase.database();
    SYNC.ref=SYNC.db.ref('espaces/'+ESPACE);
    SYNC.dataRef=SYNC.ref.child('data');
    SYNC.pushRef=SYNC.ref.child('push');
    SYNC.first=true;
    SYNC.dataRef.on('value',snap=>{
      const remote=snap.val();
      if(SYNC.first){
        SYNC.first=false;
        if(remote&&remote.blob){
          let d=null;try{d=JSON.parse(remote.blob);}catch(e){}
          if(d){SYNC.applying=true;applyRemoteData(mergeStates(S,d));SYNC.applying=false;
            try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}renderAll();}
        }
        pushCloud(true);setSyncPill('on');return;
      }
      if(!remote||!remote.blob){setSyncPill('on');return;}
      const rt=remote._updatedAt||0,lt=S._updatedAt||0;
      if(rt>lt){let d=null;try{d=JSON.parse(remote.blob);}catch(e){return;}
        SYNC.applying=true;applyRemoteData(d);SYNC.applying=false;
        try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}renderAll();toast('☁️ Carnet synchronisé');}
      setSyncPill('on');
    },()=>setSyncPill('err'));
  }catch(e){setSyncPill('err');}
}
function authErr(e){
  const c=(e&&e.code)||'';
  if(c.indexOf('wrong-password')>=0||c.indexOf('invalid-credential')>=0)return 'Mot de passe incorrect';
  if(c.indexOf('user-not-found')>=0)return 'Aucun compte pour cet e-mail';
  if(c.indexOf('invalid-email')>=0)return 'E-mail invalide';
  if(c.indexOf('too-many-requests')>=0)return "Trop d'essais — réessaie dans un moment";
  if(c.indexOf('network')>=0)return 'Pas de connexion internet';
  return (e&&e.message)?e.message:'Connexion refusée';
}

let swReg=null,deferredInstall=null;
function b64ToU8(base64){const pad='='.repeat((4-base64.length%4)%4);const b=(base64+pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(b);const arr=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);return arr;}
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;}
function isiOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent);}
function pushSupported(){return('serviceWorker'in navigator)&&('PushManager'in window)&&('Notification'in window);}
function initPWA(){
  if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js').then(r=>{swReg=r;}).catch(()=>{});}
  window.addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();deferredInstall=ev;});
  window.addEventListener('offline',()=>setSyncPill('off'));
  window.addEventListener('online',()=>{if(syncActive())setSyncPill('connecting');fetchRates(true);});

async function enablePush(){
  if(!syncActive()){toast("Active d'abord la synchro ☁️ (les notifs en dépendent)");return;}
  if(!pushSupported()){toast('Notifications non supportées sur ce navigateur');return;}
  if(isiOS()&&!isStandalone()){toast("iPhone : ajoute d'abord à l'écran d'accueil, puis rouvre depuis l'icône");return;}
  try{
    if(!swReg)swReg=await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Notifications refusées dans les réglages');return;}
    let sub=await swReg.pushManager.getSubscription();
    if(!sub)sub=await swReg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(VAPID_PUBLIC)});
    const j=sub.toJSON();
    const key=(j.keys&&j.keys.auth?j.keys.auth:('s'+Date.now())).replace(/[.#$\[\]\/]/g,'_');
    if(SYNC.pushRef)await SYNC.pushRef.child(key).set({endpoint:j.endpoint,keys:j.keys,at:Date.now(),ua:navigator.userAgent.slice(0,120)});
    swReg.showNotification("Tour d'Asie",{body:'✅ Notifications activées sur cet appareil !',icon:'icon-192.png',badge:'icon-192.png'});
    toast('🔔 Notifications activées');closeModal();

}

const $=(s,r=document)=>r.querySelector(s);
function today(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function pd(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function dbtw(a,b){return Math.round((b-a)/864e5);}
const eur=n=>Math.round(n).toLocaleString('fr-FR')+' €';
const fdate=s=>pd(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('show'),2100);}
const cssId=s=>s.replace(/[^a-z0-9]/gi,'_');
const esc=s=>s.replace(/'/g,"\\'");

function stageUnits(st){let u=0;st.blocks.forEach(b=>{u+=b.days?b.days.length:1;});return u;}
function stageDone(st){let d=0;st.blocks.forEach(b=>{if(b.days){b.days.forEach(dy=>{if(S.days[st.id+'-'+dy.n])d++;});}else{if(S.blocks[st.id+'-'+b.c])d++;}});return d;}
function tripUnits(){return STAGES.reduce((a,s)=>a+stageUnits(s),0);}
function tripDone(){return STAGES.reduce((a,s)=>a+stageDone(s),0);}
function fmtRange(st){const o={day:'numeric',month:'short'};return pd(st.start).toLocaleDateString('fr-FR',o)+' → '+pd(st.end).toLocaleDateString('fr-FR',o);}
function stagePhoto(st){return S.photos[st.id]||(st.photo?IMG(st.photo):null);}
function bannerBg(st){
  const url=stagePhoto(st),ov="linear-gradient(180deg,rgba(40,32,24,.12),rgba(40,32,24,.62))",
    fb=`linear-gradient(135deg,${st.col},${shade(st.col,-22)})`;
  return url?`background-image:${ov},url('${url}'),${fb}`:`background-image:${ov},${fb}`;
}
function shade(hex,p){let n=parseInt(hex.slice(1),16),r=(n>>16)+p,g=(n>>8&255)+p,b=(n&255)+p;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+(1<<24|r<<16|g<<8|b).toString(16).slice(1);}

function renderToday(){
  const t=today(),start=pd(TRIP_START),end=pd(TRIP_END),total=dbtw(start,end);
  let cur=null;for(const st of STAGES){if(t>=pd(st.start)&&t<pd(st.end)){cur=st;break;}}
  let html='';
  if(t<start){
    const dl=dbtw(t,start);
    html+=`<div class="phero"><div class="pc">
      <span class="badge">Compte à rebours</span>
      <div class="big">J-${dl} <small>avant le départ</small></div>
      <div class="sub">Départ le 14 octobre 2026 depuis Madrid · retour visé fin mai 2027</div>
    </div></div>`;
  } else if(t>=end){
    html+=`<div class="phero"><div class="pc"><span class="badge">Voyage terminé</span>
      <div class="big">🏡 De retour</div><div class="sub">7,5 mois · 6 pays · il reste les rushes à monter !</div></div></div>`;
  } else {
    const done=dbtw(start,t),pct=Math.round(done/total*100),ph=cur?stagePhoto(cur):null;
    const bg=ph?`background-image:linear-gradient(180deg,rgba(40,32,24,.1),rgba(40,32,24,.66)),url('${ph}'),linear-gradient(135deg,${cur.col},${shade(cur.col,-22)})`:'';
    html+=`<div class="phero" ${ph?`style="${bg};background-size:cover;background-position:center"`:''}><div class="pc">
      <span class="badge">Jour ${done+1} / ${total}</span>
      <div class="cur">${cur?cur.fl:'🌏'} ${cur?cur.nm:'En transit'}</div>
      <div class="sub">${cur?cur.route:''}</div>
      <div class="pbar"><i style="width:${pct}%"></i></div>
      <div class="pmeta"><span>${pct}% parcouru</span><span>${dbtw(t,end)} jours restants</span></div>
    </div></div>`;
  }
  const du=tripUnits(),dd=tripDone(),spent=S.expenses.reduce((a,e)=>a+toEur(e),0),prevu=BUDGET_PREVU.reduce((a,b)=>a+b.v,0);
  html+=`<div class="stats">
    <div class="stat"><div class="n">${dd}</div><div class="l">jours faits</div></div>
    <div class="stat"><div class="n">${Math.round(dd/du*100)}%</div><div class="l">itinéraire</div></div>
    <div class="stat"><div class="n">${eur(spent)}</div><div class="l">dépensé</div></div>
  </div>`;

  // prochain rappel
  const next=nextReminder();
  if(next){
    const w=remWhen(next,t);
    html+=`<div class="sec-title">Prochain rappel</div>
    <div class="rem" onclick="nav('rem')"><span class="barcol" style="background:var(--acc)"></span>
      <span class="icn">${next.icon}</span><div class="ri"><div class="t">${next.t}</div>
      <div class="s">${next.s}</div><span class="when ${w.cls}">${w.label}</span>
      ${next.push?'<div class="bell">🔔 notification push programmée</div>':''}</div></div>`;
  }

  // galerie
  html+=`<div class="sec-title">Aperçu du voyage</div>
  <div class="strip">${GALLERY.map(g=>`<div class="pcard"><img class="im" loading="lazy" src="${IMG(g.id)}" onerror="this.style.display='none'"><div class="cap">${g.c}</div></div>`).join('')}</div>`;

  // suite du parcours
  html+=`<div class="sec-title">La suite du parcours</div><div class="card">`;
  let up=STAGES.filter(st=>pd(st.end)>t).slice(0,4);if(!up.length)up=STAGES.slice(-2);
  up.forEach(st=>{const dsc=stageDone(st),tot=stageUnits(st),now=cur&&cur.id===st.id;
    html+=`<div class="mini" onclick="nav('itin')"><span class="dot" style="background:${st.col}"></span>
      <div class="txt"><div class="t">${st.fl} ${st.nm} ${now?'<span class="tag now" style="background:var(--acc-soft);color:var(--acc-d)">ici</span>':''}</div>
      <div class="d">${fmtRange(st)} · ${st.days} j · ${dsc}/${tot} faits</div></div></div>`;});
  html+=`</div>`;
  $('#v-today').innerHTML=html;
}
function nextReminder(){const t=today();const pend=REMINDERS.filter(r=>!S.reminders[r.id]).sort((a,b)=>pd(a.date)-pd(b.date));
  const late=pend.filter(r=>pd(r.date)<=t);if(late.length)return late[late.length-1];
  const fut=pend.filter(r=>pd(r.date)>t);return fut[0]||null;}
function remWhen(r,t){
  if(S.reminders[r.id])return{cls:'w-done',label:'✓ fait'};
  const d=dbtw(t,pd(r.date));
  if(d<0)return{cls:'w-late',label:`⚠ à faire — échu depuis ${-d} j`};
  if(d===0)return{cls:'w-now',label:"⚠ c'est le moment"};
  if(d<=14)return{cls:'w-soon',label:`dans ${d} j — ${fdate(r.date)}`};
  return{cls:'w-far',label:fdate(r.date)};
}

    const tot=stageUnits(st),dsc=stageDone(st),pct=Math.round(dsc/tot*100),now=cur&&cur.id===st.id;
    html+=`<div class="stage ${now?'open':''}" id="stg-${st.id}">
      <div class="banner" style="${bannerBg(st)};background-size:cover;background-position:center" onclick="toggleStage('${st.id}')">

        <button class="photobtn" onclick="event.stopPropagation();openPhoto('${st.id}')">📷</button>
        <div class="bov">
          <span class="fl">${st.fl}</span>
          <div class="bi"><div class="nm">${st.nm} ${st.tag==='val'?'<span class="tag val">validé</span>':''}${st.tag==='add'?'<span class="tag add">hors sentiers</span>':''}${now?'<span class="tag now">ici</span>':''}</div>
          <div class="meta">${fmtRange(st)} · ${st.days} j · ${eur(st.budget)}</div></div>
          <span class="chev">▶</span>
        </div>
      </div>
      <div class="stage-body">
        <div class="sb-line"><span class="k">Route</span><span>${st.route}</span></div>
        <div class="sb-line"><span class="k">Visa</span><span>${st.visa}</span></div>
        ${st.note?`<div class="sb-line"><span class="k">À noter</span><span>${st.note}</span></div>`:''}
        <div class="film"><b>📸 À filmer :</b> ${st.film}</div>
        ${pratiqueHtml(st)}
        ${st.blocks.map(b=>blockHtml(st,b)).join('')}
      </div></div>`;
  });
  $('#v-itin').innerHTML=html;
}
function ring(pct){const r=15,c=2*Math.PI*r,off=c-(pct/100)*c;const col=pct>=100?'#8be0a4':'#ffffff';
  return `<div class="ring"><svg width="40" height="40">
    <circle cx="20" cy="20" r="${r}" fill="rgba(0,0,0,.25)" stroke="rgba(255,255,255,.35)" stroke-width="3"/>
    <circle cx="20" cy="20" r="${r}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
  </svg><span class="pct">${pct}%</span></div>`;}
function spotsHtml(st,b){
  if(!b.spots||!b.spots.length)return '';
  const ctx=', '+b.c+', '+st.nm;
  return `<div class="spots"><span class="spots-l">Lieux, tarifs & astuces — toucher le nom pour Google Maps</span>`+
    b.spots.map(sp=>{
      const nm=(typeof sp==='string')?sp:sp.n;
      const star=`<span class="wish ${isWished(nm)?'on':''}" onclick="event.stopPropagation();toggleWishItin('${esc(nm)}',this)">${isWished(nm)?'★':'☆'}</span>`;
      const link=`<a class="spot" target="_blank" rel="noopener" onclick="event.stopPropagation()" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(nm+ctx)}">${nm}</a>`;
      const p=(sp&&sp.p)?`<span class="spot-p">${sp.p}</span>`:'';
      const t=(sp&&sp.t)?`<div class="spot-t">💡 ${sp.t}</div>`:'';
      return `<div class="spot-row">${star}${link}${p}${t}</div>`;
    }).join('')+`</div>`;
}
function findSpot(b,name){if(b.spots){for(const s of b.spots){if((typeof s==='string'?s:s.n)===name)return s;}}return {n:name};}
function fichesHtml(st,b,names){
  if(!names||!names.length)return '';
  const ctx=', '+b.c+', '+st.nm;
  return `<div class="spots">`+names.map(nm=>{
    const sp=findSpot(b,nm);
    const label=(typeof sp==='string')?sp:sp.n;
    const star=`<span class="wish ${isWished(label)?'on':''}" onclick="event.stopPropagation();toggleWishItin('${esc(label)}',this)">${isWished(label)?'★':'☆'}</span>`;
    const link=`<a class="spot" target="_blank" rel="noopener" onclick="event.stopPropagation()" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(label+ctx)}">${label}</a>`;
    const p=(sp&&sp.p)?`<span class="spot-p">${sp.p}</span>`:'';
    const t=(sp&&sp.t)?`<div class="spot-t">💡 ${sp.t}</div>`:'';
    return `<div class="spot-row">${star}${link}${p}${t}</div>`;
  }).join('')+`</div>`;
}
function restoHtml(st,b){
  if(!b.resto||!b.resto.length)return '';
  const ctx=', '+b.c+', '+st.nm;
  const rows=b.resto.map(r=>{
      const nm=r.n;
      const star=`<span class="wish ${isWished(nm)?'on':''}" onclick="event.stopPropagation();toggleWishItin('${esc(nm)}',this)">${isWished(nm)?'★':'☆'}</span>`;
      const link=`<a class="spot" target="_blank" rel="noopener" onclick="event.stopPropagation()" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(nm+ctx)}">${nm}</a>`;
      const p=r.p?`<span class="spot-p">${r.p}</span>`:'';
      const t=r.t?`<div class="spot-t">🍽️ ${r.t}</div>`:'';
      return `<div class="spot-row">${star}${link}${p}${t}</div>`;
    }).join('');
  return `<div class="spots resto folded"><span class="spots-l resto-toggle" onclick="event.stopPropagation();this.parentNode.classList.toggle('folded')">🍜 Où manger <span class="rcount">${b.resto.length}</span> <span class="rchev">▾</span></span><div class="resto-list">${rows}</div></div>`;
}

function blockHtml(st,b){
  const bid=st.id+'-'+b.c;
  const mapl=b.co?`<a class="mapl" href="https://www.google.com/maps/search/?api=1&query=${b.co[0]},${b.co[1]}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Ouvrir dans Google Maps">📍</a>`:'';
  if(b.days){
    const all=b.days.every(d=>S.days[st.id+'-'+d.n]);

      <div class="block-h ${all?'done':''}">
        <div class="cb ${all?'on':''}" onclick="toggleBlockDays('${st.id}','${esc(b.c)}',event)"></div>

        ${mapl}<div class="exp" onclick="toggleDays('${cssId(bid)}')">▾</div></div>
      <div class="days">${b.days.map(d=>{const done=S.days[st.id+'-'+d.n];return`
        <div class="day ${done?'done':''}"><div class="cb ${done?'on':''}" onclick="toggleDay('${st.id}',${d.n})"></div>
          <span class="num">J${d.n}</span><div class="dtx"><span class="dc">${d.dt}</span> — ${d.t}${fichesHtml(st,b,d.sp)}</div></div>`;}).join('')}</div>${restoHtml(st,b)}${socialHtml(st,b)}</div>`;
  }
  const done=S.blocks[bid];
  return `<div class="block"><div class="block-h ${done?'done':''}">
    <div class="cb ${done?'on':''}" onclick="toggleSimpleBlock('${st.id}','${esc(b.c)}')"></div>

    <div class="dd" style="margin-top:3px">${b.sum}</div></div>${mapl}</div>${spotsHtml(st,b)}${restoHtml(st,b)}${socialHtml(st,b)}</div>`;

function toggleStage(id){$('#stg-'+id).classList.toggle('open');}
function toggleDays(cid){$('#blk-'+cid).classList.toggle('open');}
function toggleDay(sid,n){S.days[sid+'-'+n]=!S.days[sid+'-'+n];save();renderItin();$('#stg-'+sid).classList.add('open');}
function toggleBlockDays(sid,c,ev){ev.stopPropagation();const st=STAGES.find(s=>s.id===sid),b=st.blocks.find(x=>x.c===c);
  const all=b.days.every(d=>S.days[sid+'-'+d.n]);b.days.forEach(d=>S.days[sid+'-'+d.n]=!all);save();renderItin();$('#stg-'+sid).classList.add('open');}
function toggleSimpleBlock(sid,c){S.blocks[sid+'-'+c]=!S.blocks[sid+'-'+c];save();renderItin();$('#stg-'+sid).classList.add('open');}

/* ============ BUDGET ============ */
/* ===== devises & partage (Tricount) ===== */
const PAYERS=[{id:"marie",nm:"Marie",em:"👩"},{id:"baptiste",nm:"Baptiste",em:"👨"}];
function rateOf(cur){const r=(S.rates&&S.rates[cur]!=null)?S.rates[cur]:DEFAULT_RATES[cur];return (r!=null)?r:1;}
function toEur(e){return (parseFloat(e.amt)||0)*rateOf(e.cur||'EUR');}
function fmtCur(amt,cur){cur=cur||'EUR';const c=CURRENCIES.find(x=>x.c===cur),sym=c?c.s:cur,n=Math.round(amt).toLocaleString('fr-FR');return cur==='EUR'?(n+' €'):(n+' '+sym);}
function payerName(id){const p=PAYERS.find(x=>x.id===id);return p?p.nm:'';}
function meAsPayer(){const em=(SYNC.user&&SYNC.user.email)||'';return em.indexOf('baptiste')>=0?'baptiste':'marie';}
function updateEurPreview(){const s=$('#e-cur'),a=$('#e-amt'),o=$('#e-eur');if(!s||!o)return;const cur=s.value,amt=parseFloat(a.value)||0;
  o.textContent=(amt&&cur!=='EUR')?('≈ '+eur(amt*rateOf(cur))+'   (1 '+cur+' = '+rateOf(cur)+' €)'):'';}
function openRates(){
  const rates=Object.assign({},DEFAULT_RATES,S.rates||{});
  const maj=S._ratesAt?('Cours mis à jour le '+new Date(S._ratesAt).toLocaleString('fr-FR')):'Cours par défaut (pas encore actualisés)';
  $('#modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">
    <div class="grabber"></div><h3>💱 Taux de change (vers €)</h3>
    <div class="info">🔄 Les taux se mettent à jour <b>automatiquement</b> (cours du jour) dès que tu ouvres l'appli connectée.<br><span style="font-size:11px;color:var(--muted)">${maj}</span></div>
    <button class="btn ghost" onclick="fetchRates(true)">🔄 Actualiser maintenant</button>
    <p style="color:var(--ink2);font-size:12.5px;margin:12px 2px 4px">Tu peux aussi <b>ajuster à la main</b> (valeur d'1 unité en €). Une valeur manuelle tient jusqu'à la prochaine actualisation auto.</p>
    ${CURRENCIES.filter(c=>c.c!=='EUR').map(c=>`<label class="fl-l">${c.s} 1 ${c.c} — ${c.nm}</label><input id="rate-${c.c}" type="number" inputmode="decimal" step="0.000001" value="${rates[c.c]}">`).join('')}
    <button class="btn" onclick="saveRates()">Enregistrer mes taux</button>
    <button class="btn ghost" onclick="closeModal()">Fermer</button></div></div>`;
}
function saveRates(){S.rates=S.rates||{};CURRENCIES.forEach(c=>{if(c.c==='EUR')return;const el=$('#rate-'+c.c);if(!el)return;const v=parseFloat(el.value);if(v>0)S.rates[c.c]=v;});
  save();closeModal();renderBudget();renderToday();toast('✓ Taux mis à jour');}
function fetchRates(force){
  if(!force && S._ratesAt && (Date.now()-S._ratesAt)<6*3600e3)return;
  fetch('https://open.er-api.com/v6/latest/EUR').then(r=>r.json()).then(d=>{
    if(!d||d.result!=='success'||!d.rates)return;
    S.rates=S.rates||{};let changed=false;
    CURRENCIES.forEach(c=>{if(c.c==='EUR')return;const v=d.rates[c.c];if(!v||v<=0)return;const eurPer=Math.round((1/v)*1e6)/1e6;
      if(!S.rates[c.c]||Math.abs(S.rates[c.c]-eurPer)/eurPer>0.003){S.rates[c.c]=eurPer;changed=true;}});
    S._ratesAt=Date.now();
    if(changed){save();}else{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
    if($('#modal')&&$('#modal').innerHTML.indexOf('Taux de change')>=0){openRates();if(force)toast('✓ Taux actualisés');}
    if(!$('#v-budget').classList.contains('hidden'))renderBudget();
  }).catch(()=>{if(force)toast('Actualisation impossible (hors-ligne ?)');});
}
function renderBudget(){
  const spent=S.expenses.reduce((a,e)=>a+toEur(e),0),prevu=BUDGET_PREVU.reduce((a,b)=>a+b.v,0);
  let html=`<div class="lhero bud-hero"><span class="badge">Dépenses réelles · total en €</span>
    <div class="bud-tot">${eur(spent)}</div>
    <div class="pmeta" style="margin-top:6px">sur ${eur(prevu)} prévus · reste ${eur(prevu-spent)}</div>
    <div class="pbar"><i style="width:${Math.min(100,spent/prevu*100)}%"></i></div>
    <div class="pmeta"><span>${Math.round(spent/prevu*100)}% du budget</span><span>${eur(spent/TRAVELERS)}/pers</span></div></div>`;
  html+=`<div style="text-align:center;margin:-4px 0 12px"><button class="chip" onclick="openRates()">💱 Taux de change</button></div>`;
  const byM=S.expenses.filter(e=>(e.by||'marie')==='marie').reduce((a,e)=>a+toEur(e),0);
  const byB=S.expenses.filter(e=>e.by==='baptiste').reduce((a,e)=>a+toEur(e),0);
  const setl=S.settlements||[];
  const sumB2M=setl.filter(x=>x.from==='baptiste').reduce((a,x)=>a+toEur(x),0);
  const sumM2B=setl.filter(x=>x.from==='marie').reduce((a,x)=>a+toEur(x),0);
  const owe=(byM-byB)/2-sumB2M+sumM2B; // >0 : Baptiste doit encore à Marie
  const settle=Math.abs(owe)<0.5?"Vous êtes à égalité 👍":(owe>0
    ?`<b>Baptiste</b> doit <b style="color:var(--acc-d)">${eur(owe)}</b> à <b>Marie</b>`
    :`<b>Marie</b> doit <b style="color:var(--acc-d)">${eur(-owe)}</b> à <b>Baptiste</b>`);
  html+=`<div class="sec-title">Qui a payé · remboursement</div><div class="card">
    <div class="cat-line" style="border-top:none"><span class="fl">👩</span><span class="nm">Marie a payé</span><span class="amt"><span class="r">${eur(byM)}</span></span></div>
    <div class="cat-line"><span class="fl">👨</span><span class="nm">Baptiste a payé</span><span class="amt"><span class="r">${eur(byB)}</span></span></div>
    ${setl.slice().sort((a,b)=>b.id-a.id).map(x=>`<div class="cat-line"><span class="fl">🔁</span><span class="nm" style="font-weight:400;font-size:13px">${payerName(x.from)} → ${payerName(x.from==='marie'?'baptiste':'marie')} (remboursement)${x.label?'<br><span style="color:var(--muted);font-size:11px">'+x.label+'</span>':''}</span><span class="amt"><span class="r">${eur(toEur(x))}</span></span><button class="del" onclick="delSettle(${x.id})">✕</button></div>`).join('')}
    <div class="info" style="margin:10px 0 0"><span style="font-size:16px">🤝</span> ${settle}<div style="font-size:11px;color:var(--muted);margin-top:3px">Dépenses « pour 2 » partagées à parts égales, remboursements déduits.</div></div>
    <button class="btn ghost" style="margin-top:10px" onclick="openSettle()">🔁 Enregistrer un remboursement</button>
  </div>`;
  html+=`<div class="sec-title">Par pays — réel vs prévu</div><div class="card">`;
  BUDGET_PREVU.forEach(b=>{const r=S.expenses.filter(e=>e.country===b.id).reduce((a,e)=>a+toEur(e),0),p=Math.min(100,r/b.v*100),over=r>b.v;
    html+=`<div class="cat-line" style="flex-wrap:wrap"><span class="fl">${b.fl}</span><span class="nm">${b.nm}</span>
      <span class="amt"><span class="r" style="color:${over?'var(--red)':'var(--ink)'}">${eur(r)}</span> <span class="p">/ ${eur(b.v)}</span></span>
      <div class="tinybar" style="flex-basis:100%"><i style="width:${p}%;background:${over?'var(--red)':'linear-gradient(90deg,var(--acc),var(--gold))'}"></i></div></div>`;});
  html+=`</div><div class="sec-title">Par catégorie</div><div class="card">`;
  CATS.forEach(c=>{const r=S.expenses.filter(e=>e.cat===c.id).reduce((a,e)=>a+toEur(e),0);
    html+=`<div class="cat-line"><span class="fl">${c.fl}</span><span class="nm">${c.nm}</span><span class="amt"><span class="r">${eur(r)}</span></span></div>`;});
  html+=`</div><div class="sec-title">Dernières dépenses</div><div class="card">`;
  if(!S.expenses.length)html+=`<div class="empty">Aucune dépense.<br>Appuie sur <b>+</b> en bas à droite pour en ajouter.</div>`;
  else [...S.expenses].sort((a,b)=>b.id-a.id).forEach(e=>{const c=CATS.find(x=>x.id===e.cat)||{fl:'💸'},co=BUDGET_PREVU.find(x=>x.id===e.country)||{fl:'🌏',nm:''};
    const orig=(e.cur&&e.cur!=='EUR');
    html+=`<div class="exp-item"><span class="em">${c.fl}</span><div class="ei"><div class="t">${e.label||c.nm}</div>
      <div class="s">${co.fl} ${co.nm} · ${e.date||''} · payé par ${payerName(e.by||'marie')}</div></div>
      <span class="ea" style="text-align:right">${orig?`${fmtCur(e.amt,e.cur)}<div style="font-size:10px;color:var(--muted);font-weight:600">≈ ${eur(toEur(e))}</div>`:eur(toEur(e))}</span>
      ${e.receipt?`<button class="del" style="color:var(--acc-d)" onclick="viewReceipt(${e.id})" title="Voir le reçu">🧾</button>`:''}
      <button class="del" onclick="delExpense(${e.id})">✕</button></div>`;});
  html+=`</div>`;
  $('#v-budget').innerHTML=html;
}
function delExpense(id){S.expenses=S.expenses.filter(e=>e.id!==id);save();renderBudget();renderToday();}
let settleSel={from:'baptiste'};
function openSettle(){
  settleSel={from:(meAsPayer()==='marie'?'baptiste':'marie')};
  const d=new Date().toISOString().slice(0,10);
  $('#modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">
    <div class="grabber"></div><h3>🔁 Remboursement</h3>
    <p style="color:var(--ink2);font-size:13px;margin:0 2px 8px">Quand l'un rembourse l'autre (ex. sa part du vol), enregistre-le ici pour rééquilibrer les comptes. Ce n'est pas une dépense partagée, juste un transfert entre vous.</p>
    <label class="fl-l">Qui rembourse (donne l'argent) ?</label>
    <div class="chips" id="s-from">${PAYERS.map(p=>`<button class="chip ${p.id===settleSel.from?'on':''}" data-c="${p.id}" onclick="pickFrom('${p.id}')">${p.em} ${p.nm}</button>`).join('')}</div>
    <label class="fl-l">Devise</label>
    <select id="s-cur">${CURRENCIES.map(c=>`<option value="${c.c}" ${c.c==='EUR'?'selected':''}>${c.s} ${c.c} — ${c.nm}</option>`).join('')}</select>
    <label class="fl-l">Montant</label><input id="s-amt" type="number" inputmode="decimal" placeholder="0" step="0.01">
    <label class="fl-l">Note (optionnel)</label><input id="s-label" placeholder="Ex : sa part du vol Madrid→Pékin">
    <label class="fl-l">Date</label><input id="s-date" type="date" value="${d}">
    <button class="btn" onclick="addSettle()">Enregistrer le remboursement</button><button class="btn ghost" onclick="closeModal()">Annuler</button></div></div>`;
}
function pickFrom(id){settleSel.from=id;document.querySelectorAll('#s-from .chip').forEach(c=>c.classList.toggle('on',c.dataset.c===id));}
function addSettle(){const amt=parseFloat($('#s-amt').value);if(!amt||amt<=0){toast('Entre un montant valide');return;}
  S.settlements=S.settlements||[];
  S.settlements.push({id:Date.now(),from:settleSel.from,amt,cur:($('#s-cur')?$('#s-cur').value:'EUR'),label:$('#s-label').value.trim(),date:$('#s-date').value});
  save();closeModal();renderBudget();toast('✓ Remboursement enregistré');}
function delSettle(id){S.settlements=(S.settlements||[]).filter(x=>x.id!==id);save();renderBudget();}

/* ============ RAPPELS ============ */
let remTab='ech';
function renderRem(){
  const t=today();
  let html=`<div class="seg"><button class="${remTab==='ech'?'on':''}" onclick="setRemTab('ech')">🔔 Échéances</button>
    <button class="${remTab==='prep'?'on':''}" onclick="setRemTab('prep')">🧳 Préparatifs</button></div>`;
  if(remTab==='ech'){
    html+=`<div class="info">🔔 Les rappels marqués <b>notification programmée</b> t'arrivent en <b>notification push</b> sur ton téléphone, même carnet fermé, et se relancent chaque semaine jusqu'à ce que tu répondes « c'est fait ». Ceux-ci s'affichent aussi ici pour t'en souvenir.</div>`;
    const rems=[...REMINDERS].sort((a,b)=>pd(a.date)-pd(b.date));
    html+=`<div class="sec-title">Réservations & démarches datées</div>`;
    rems.forEach(r=>{const w=remWhen(r,t),done=S.reminders[r.id];
      html+=`<div class="rem ${done?'done':''}"><span class="barcol" style="background:${done?'var(--sage)':barByWhen(w.cls)}"></span>
        <div class="cb ${done?'on':''}" onclick="toggleRem('${r.id}')" style="margin-top:1px"></div>
        <div class="ri"><div class="t">${r.icon} ${r.t}</div><div class="s">${r.s}</div>
        <span class="when ${w.cls}">${w.label}</span>
        ${r.push?'<div class="bell">🔔 notification push programmée</div>':'<div class="bell" style="color:var(--muted)">🔕 rappel dans l\'app</div>'}</div></div>`;});
    // vols
    html+=`<div class="sec-title" style="margin-top:20px">Mes vols & enregistrement</div>`;
    html+=`<div class="info">Ajoute tes vols au fur et à mesure des réservations : je t'afficherai le compte à rebours du check-in. Pour recevoir une <b>vraie notification push d'enregistrement ~48h avant</b>, redis-moi simplement dans le chat « ajoute un rappel check-in » avec la date du vol.</div>`;
    if(!S.flights.length)html+=`<div class="empty">Aucun vol enregistré.<br>Appuie sur « + Ajouter un vol ».</div>`;
    else [...S.flights].sort((a,b)=>pd(a.date+'T'+(a.time||'00:00'))-pd(b.date+'T'+(b.time||'00:00'))).forEach(f=>{
      const dep=new Date(f.date+'T'+(f.time||'00:00')),ci=new Date(dep.getTime()-48*3600e3),now=new Date();
      let st,cls;const dd=Math.ceil((dep-now)/864e5);
      if(dep<now){st='✈️ Vol passé';cls='w-done';}
      else if(now>=ci){st='🟢 Enregistrement ouvert !';cls='w-now';}
      else{const h=Math.ceil((ci-now)/3600e3);st=h>48?`Check-in ouvre dans ${Math.ceil(h/24)} j`:`Check-in ouvre dans ${h} h`;cls='w-soon';}
      html+=`<div class="flight"><div class="fr"><div class="rt">✈️ ${f.from} → ${f.to}</div>
        <div class="dt">${pd(f.date).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}${f.time?' · '+f.time:''}${f.conf?' · '+f.conf:''}</div>
        <span class="ci ${cls}">${st}</span></div><button class="del" onclick="delFlight(${f.id})">✕</button></div>`;});
    html+=`<button class="btn ghost" style="margin-top:6px" onclick="openFlight()">＋ Ajouter un vol</button>`;
  } else {
    const all=CHECK.reduce((a,g)=>a+g.items.length,0),done=CHECK.reduce((a,g)=>a+g.items.filter(i=>S.check[i.id]).length,0);
    html+=`<div class="lhero"><span class="badge">Préparation</span><div class="big">${done}<small> / ${all} démarches</small></div>
      <div class="pbar"><i style="width:${Math.round(done/all*100)}%"></i></div>
      <div class="pmeta"><span>${Math.round(done/all*100)}% prêt</span><span>${all-done} restantes</span></div></div>`;
    CHECK.forEach(g=>{html+=`<div class="ck-when">▹ ${g.when}</div>`;
      g.items.forEach(i=>{const d=S.check[i.id];
        html+=`<div class="ck-item ${d?'done':''}" onclick="toggleCheck('${i.id}')"><div class="cb big ${d?'on':''}"></div>
          <div class="ci"><div class="t">${i.t}</div>${i.s?`<div class="s">${i.s}</div>`:''}</div></div>`;});});
  }
  $('#v-rem').innerHTML=html;
}
function barByWhen(c){return c==='w-now'||c==='w-late'?'var(--red)':c==='w-soon'?'var(--acc)':c==='w-done'?'var(--sage)':'var(--line2)';}
function setRemTab(t){remTab=t;renderRem();window.scrollTo(0,0);}
function toggleRem(id){S.reminders[id]=!S.reminders[id];save();renderRem();renderToday();}
function toggleCheck(id){S.check[id]=!S.check[id];save();renderRem();}
function delFlight(id){S.flights=S.flights.filter(f=>f.id!==id);save();renderRem();}
function openFlight(){
  $('#modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">
    <div class="grabber"></div><h3>✈️ Ajouter un vol</h3>
    <div class="row2"><div><label class="fl-l">De</label><input id="f-from" placeholder="Ex : Madrid"></div>
    <div><label class="fl-l">Vers</label><input id="f-to" placeholder="Ex : Pékin"></div></div>
    <div class="row2"><div><label class="fl-l">Date</label><input id="f-date" type="date"></div>
    <div><label class="fl-l">Heure</label><input id="f-time" type="time"></div></div>
    <label class="fl-l">N° de réservation (optionnel)</label><input id="f-conf" placeholder="Ex : ABC123">
    <button class="btn" onclick="addFlight()">Ajouter le vol</button>
    <button class="btn ghost" onclick="closeModal()">Annuler</button></div></div>`;
}
function addFlight(){const from=$('#f-from').value.trim(),to=$('#f-to').value.trim(),date=$('#f-date').value;
  if(!from||!to||!date){toast('Renseigne au moins départ, arrivée et date');return;}
  S.flights.push({id:Date.now(),from,to,date,time:$('#f-time').value,conf:$('#f-conf').value.trim()});
  save();closeModal();renderRem();toast('✓ Vol ajouté');}

/* notifications locales (quand le carnet est ouvert) */
let notifAsked=false;const notifShown=new Set();
function askNotif(){if(notifAsked)return;notifAsked=true;
  try{if('Notification'in window&&Notification.permission==='default'){Notification.requestPermission().then(checkDue);}else checkDue();}catch(e){}}
function checkDue(){try{if(!('Notification'in window)||Notification.permission!=='granted')return;const t=today();
  REMINDERS.forEach(r=>{if(!S.reminders[r.id]&&pd(r.date)<=t&&!notifShown.has(r.id)){notifShown.add(r.id);
    new Notification('Tour d\'Asie — '+r.t,{body:r.s});}});
  S.flights.forEach(f=>{const dep=new Date(f.date+'T'+(f.time||'00:00')),ci=new Date(dep.getTime()-48*3600e3),k='f'+f.id;
    if(new Date()>=ci&&new Date()<dep&&!notifShown.has(k)){notifShown.add(k);new Notification('Enregistrement ouvert ✈️',{body:f.from+' → '+f.to});}});
  }catch(e){}}

let spotMarkers={},spotsLayer=null;
function isWished(n){return !!(S.wishlist&&S.wishlist[n]);}
function spotEmoji(n){const s=(n||'').toLowerCase();
  if(/wat |temple|pagode|pagoda|sanctuaire|monast|shrine|inari|-ji|tōdai|todai|torii|stupa|that luang|angkor|bayon|prohm|banteay|xieng thong|songzanlin|kushida|itsukushima|senso/.test(s))return '🛕';
  if(/château|citadelle|palais|palace|fort|remparts|forbidden|cité interdite|castle|kumamoto|crazy house/.test(s))return '🏯';
  if(/musée|museum|mémorial|memorial|cope|tuol sleng|genbaku|vestiges|bombe|choeung/.test(s))return '🏛️';
  if(/plage|beach|lagoon|bay|baie|saracen|klong|railay|ao nang|kradan|ngai|farmer|sivalai|long beach|an bang|klong dao/.test(s))return '🏖️';
  if(/koh |île|island|rong samloem|lapins|yao noi|coron|palawan/.test(s))return '🏝️';
  if(/cascade|waterfall|chutes|falls|kuang si|datanla|bou sra|bua thong|sticky/.test(s))return '💧';
  if(/grotte|cave|tham|morakot|paradise cave|dark cave|pak ou|pha tok|chiang dao/.test(s))return '🕳️';
  if(/mont |montagne|mountain|peak|doi |col |fansipan|phousi|misen|mont aso|tapyas|nam xay|pha daeng|tianmen|tianzi|inthanon|zhangjiajie|avatar/.test(s))return '⛰️';
  if(/lac |lake|étang|xuan huong|barracuda|kayangan|twin lagoon|napa|houhai/.test(s))return '🏞️';
  if(/rizière|rice|parc|park|jardin|pudacuo|cat cat|muong hoa/.test(s))return '🌳';
  if(/marché|market|bazaar|night|talat|ben thanh|dong ba|russe|houhai|nakasu|yatai/.test(s))return '🛍️';
  if(/épave|wreck|plongée|maru|okikawa|irako/.test(s))return '🤿';
  if(/pont|bridge|megane|su tong/.test(s))return '🌉';
  if(/croisière|bateau|mékong|nam song|nam ou|pak beng|huay xai|embarcadère|muang ngoi/.test(s))return '🛶';
  if(/muraille|great wall|jinshanling/.test(s))return '🧱';
  if(/terre cuite|guerrier/.test(s))return '🗿';
  return '📍';}
function spotIcon(col,on,n,resto){const em=resto?'🍜':spotEmoji(n);const sz=on?26:22;const bd=on?'#e8b64a':(resto?'#c98a5b':col);
  return L.divIcon({className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],
    html:`<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${on?'#fff3d6':'rgba(255,255,255,.94)'};border:2px solid ${bd};box-shadow:0 1px 3px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:${on?15:13}px">${em}</div>`});}
function spotPopup(st,b,sp,resto){const on=isWished(sp.n);
  return `<div class="pop" style="max-width:230px"><b>${resto?'🍜 ':''}${sp.n}</b>${on?' ⭐':''}
    ${sp.p?`<div class="pm">💰 ${sp.p}</div>`:''}
    ${sp.t?`<div style="font-size:12px;color:#555;margin-top:3px">${resto?'🍽️':'💡'} ${sp.t}</div>`:''}
    <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(sp.n+', '+b.c+', '+st.nm)}" target="_blank" rel="noopener" style="font-size:12px;display:inline-block;margin-top:5px">Ouvrir dans Google Maps ↗</a><br>
    <a href="#" onclick="toggleWishMap('${esc(sp.n)}');return false;" style="font-size:12.5px;font-weight:700;display:inline-block;margin-top:5px;color:${on?'#b0402c':'var(--gold-d)'}">${on?(resto?'✔ Retirer de « à tester »':'✔ Retirer de « à voir »'):(resto?'🍜 Ajouter à « à tester »':'⭐ Ajouter à « à voir »')}</a></div>`;}
function refreshSpotMarker(n,reopen){const r=spotMarkers[n];if(!r)return;r.marker.setIcon(spotIcon(r.col,isWished(n),n,r.resto));r.marker.setPopupContent(spotPopup(r.st,r.b,r.sp,r.resto));if(reopen)r.marker.openPopup();}
function toggleWishMap(n){S.wishlist=S.wishlist||{};if(S.wishlist[n])delete S.wishlist[n];else S.wishlist[n]=true;save();refreshSpotMarker(n,true);buildMapCtrl();if(mapWishOnly)applySpotFilter();toast(S.wishlist[n]?'⭐ Ajouté à « à voir »':'Retiré de « à voir »');}
function toggleWishItin(n,el){S.wishlist=S.wishlist||{};if(S.wishlist[n])delete S.wishlist[n];else S.wishlist[n]=true;save();
  if(el){el.textContent=S.wishlist[n]?'★':'☆';el.classList.toggle('on',!!S.wishlist[n]);}
  if(mapInited){if(spotMarkers[n])refreshSpotMarker(n,false);buildMapCtrl();if(mapWishOnly)applySpotFilter();}}
let mapWishOnly=false;
function updateSpotsVis(){if(!map||!spotsLayer)return;if(mapWishOnly){if(!map.hasLayer(spotsLayer))map.addLayer(spotsLayer);return;}const z=map.getZoom();if(z>=6){if(!map.hasLayer(spotsLayer))map.addLayer(spotsLayer);}else{if(map.hasLayer(spotsLayer))map.removeLayer(spotsLayer);}}
function applySpotFilter(){if(!spotsLayer)return;spotsLayer.clearLayers();Object.keys(spotMarkers).forEach(n=>{if(mapWishOnly&&!isWished(n))return;spotsLayer.addLayer(spotMarkers[n].marker);});updateSpotsVis();}
function toggleWishFilter(){mapWishOnly=!mapWishOnly;applySpotFilter();buildMapCtrl();
  if(mapWishOnly&&map){const pts=Object.keys(spotMarkers).filter(n=>isWished(n)).map(n=>SPOT_CO[n]).filter(Boolean);if(pts.length)map.fitBounds(L.latLngBounds(pts),{padding:[40,40],maxZoom:12});}}
function buildMapCtrl(){const el=document.getElementById('mapctrl');if(!el)return;const cnt=Object.keys(S.wishlist||{}).length;
  el.innerHTML=`<button class="chip" style="box-shadow:0 2px 8px rgba(0,0,0,.28)" onclick="openWishlist()">⭐ À voir (${cnt})</button><button class="chip ${mapWishOnly?'on':''}" style="box-shadow:0 2px 8px rgba(0,0,0,.28)" onclick="toggleWishFilter()">Carte : ${mapWishOnly?'⭐ seulement ✔':'tout'}</button>`;}
function openWishlist(){
  const w=S.wishlist||{};const total=Object.keys(w).length;const shown={};let body='';
  if(!total)body=`<div class="empty">Aucun lieu en « à voir ».<br>Touche l'étoile ☆ sur un lieu (carte ou itinéraire) pour l'ajouter.</div>`;
  else STAGES.forEach(st=>{const rows=[];st.blocks.forEach(b=>{[].concat(b.spots||[],b.resto||[]).forEach(sp=>{const n=(typeof sp==='string')?sp:sp.n;if(!w[n]||shown[n])return;shown[n]=1;
    rows.push(`<div class="ck-item" style="margin-bottom:7px"><div class="ci"><div class="t">${n}</div>${(sp&&sp.p)?`<div class="s">💰 ${sp.p}</div>`:''}${(sp&&sp.t)?`<div class="s">💡 ${sp.t}</div>`:''}</div>
      <a class="mapl" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(n+', '+b.c+', '+st.nm)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📍</a>
      <button class="del" style="color:#e8b64a;font-size:16px" onclick="wishRemove('${esc(n)}')">★</button></div>`);});});
    if(rows.length)body+=`<div class="ck-when">${st.fl} ${st.nm}</div>`+rows.join('');});
  $('#modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">
    <div class="grabber"></div><h3>⭐ Mes lieux à voir (${total})</h3>${body}
    <button class="btn ghost" onclick="closeModal()">Fermer</button></div></div>`;
}
function wishRemove(n){if(S.wishlist)delete S.wishlist[n];save();if(mapInited){refreshSpotMarker(n,false);buildMapCtrl();applySpotFilter();}renderItin();openWishlist();}
function initMap(){
  if(mapInited)return;
  if(typeof L==='undefined'){$('#map').innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:24px;color:var(--muted)"><div style="font-size:34px;margin-bottom:10px">🗺️</div><b style="color:var(--ink)">Carte indisponible hors-ligne</b><br><span style="font-size:13px;margin-top:6px">Reconnecte-toi à internet puis rouvre cet onglet.</span></div>';return;}

        const pop=`<div class="pop"><b>${idx}. ${st.fl} ${b.c}</b>${cur?' <span style="color:var(--acc-d);font-weight:700">· ici</span>':''}
